# Change listen_port if port 9000 is already in use on your system
# Set listen_to_network to true to make Easy Diffusion accessibble on your local network
net:
  # The standard server remains available over HTTP for certificate setup
  # and recovery. The mobile/PWA plugin serves trusted HTTPS on port 10000.
  listen_port: 10000
  listen_to_network: true
#  https:
#    enabled: true
#    port: 10000
#    certfile: /home/jack/.local/share/easy-diffusion/ssl/easy-diffusion.crt
#    keyfile: /home/jack/.local/share/easy-diffusion/ssl/easy-diffusion.key
#    ca_certfile: /home/jack/.local/share/easy-diffusion/ssl/Easy-Diffusion-Local-CA.crt

# Multi GPU setup
render_devices:

# Set open_browser_on_start to false to disable opening a new browser tab on each restart
  - cuda
ui:
  open_browser_on_start: false

# Advanced backend overrides (optional)
# These are applied at startup by `scripts/check_modules.py` and exported as environment variables.
#
backend_config:
  # Keep the locally patched sdkit v3.4.1 binary; automatic validation would
  # replace it with the upstream build that has the ModelManager symbol clash.
  auto_update: false
  COMMANDLINE_ARGS:
    - --log-level
    - info
    - --keep-model-loaded
    - --image-clip-vision-on-cpu
    - --image-ip-adapter-on-cpu
    - --vae-tiling
    - --vae-tiles
    - '64'
    - --vae-tiled-overlap
    - '16'
    - --attention
    - flash
force_save_path: /mnt/1812FB8512FB6662/easy-diffusion-save-backup
# $n is a collision-safe, five-digit counter reserved for every image in a batch.
filename_format: $n_$p_$tsb64
models_dir: /mnt/84760EBC760EAECC
directories:
  checkpoints: checkpoints
  vae: vae
  taesdvae: VAE-taesd
  hypernetwork: hypernetwork
  gfpgan: gfpgan
  realesrgan: realesrgan
  lora: lora
  codeformer: codeformer
  embeddings: embeddings
  controlnet: controlnet
  controlnet-union: Controlnet_Union
  uni-controlnet: Uni_Controlnet
  controlnet-lite: Controlnet_LITE
  controlnet-lllite: controlnet-lllite
  ip-adapter: ip-adapter
  clip-vision: clip-vision
  latent-interposer: latent-interposer
  furception-vae: furception-vae
  wd14-tagger: wd14-tagger
  text-encoder: text-encoder
  video:
    - SVD
    - diffusion_models
    - mochi
    - lighttricks
  tipo: tipo
model:
  stable-diffusion: sdxl/fruitHeart_v10
vram_usage_level: balanced
tipo:
  # The vendored CUDA llama.cpp server offloads all TIPO layers on this RTX 3060.
  device: cuda
  gpu_layers: 999
gallery:
  directory: /mnt/1812FB8512FB6662/easy-diffusion-save-backup
perchance:
  gallery_id: ''
  channel: ai-furry-generator
  launcher: ''
