<template id="prompt-assist-settings-template">
    <div>
        <div><i class="fa fa-hand-sparkles"></i></div>
        <div><label for="spell-tokenizer-plugin_autocomplete_suggestions">Prompt autocomplete</label><small>Suggest prompt tags while typing.</small></div>
        <div><div class="input-toggle"><input type="checkbox" id="spell-tokenizer-plugin_autocomplete_suggestions"><label for="spell-tokenizer-plugin_autocomplete_suggestions"></label></div></div>
    </div>
    <div>
        <div><i class="fa fa-spell-check"></i></div>
        <div><label for="prompt-assist_spellcheck">Browser spellcheck</label><small>Check prompt, negative prompt, and custom modifiers.</small></div>
        <div><div class="input-toggle"><input type="checkbox" id="prompt-assist_spellcheck"><label for="prompt-assist_spellcheck"></label></div></div>
    </div>
    <div>
        <div><i class="fa fa-clone"></i></div>
        <div><label for="spell-tokenizer-plugin_duplicate_token_highlight">Highlight duplicate tokens</label><small>Highlights repeated prompt tags.</small></div>
        <div><div class="input-toggle"><input type="checkbox" id="spell-tokenizer-plugin_duplicate_token_highlight"><label for="spell-tokenizer-plugin_duplicate_token_highlight"></label></div></div>
    </div>
    <div>
        <div><i class="fa fa-shield"></i></div>
        <div><label for="spell-tokenizer-plugin_taglist_sfw_setting">SFW autocomplete tags</label><small>Restrict suggestions to the plugin's SFW list.</small></div>
        <div><div class="input-toggle"><input type="checkbox" id="spell-tokenizer-plugin_taglist_sfw_setting"><label for="spell-tokenizer-plugin_taglist_sfw_setting"></label></div></div>
    </div>
</template>
