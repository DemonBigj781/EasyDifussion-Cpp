<form method="dialog" class="outpaint-dialog-card">
    <button class="outpaint-close tertiaryButton" value="cancel" title="Close" aria-label="Close">×</button>
    <h2>Outpaint</h2>
    <p class="outpaint-subtitle">Expand any combination of edges. The source image stays pixel-aligned.</p>
    <div class="outpaint-layout">
        <section>
            <canvas id="sdkit3-outpaint-preview" width="480" height="320"></canvas>
            <div id="sdkit3-outpaint-size" class="outpaint-size"></div>
            <div class="outpaint-edge-grid">
                <span></span><label>Top <input id="sdkit3-outpaint-top" type="number" min="0" max="4096" step="8"></label><span></span>
                <label>Left <input id="sdkit3-outpaint-left" type="number" min="0" max="4096" step="8"></label>
                <button id="sdkit3-outpaint-equal" type="button" class="tertiaryButton" title="Set every edge to the largest entered value"><i class="fa-solid fa-arrows"></i> Equal</button>
                <label>Right <input id="sdkit3-outpaint-right" type="number" min="0" max="4096" step="8"></label>
                <span></span><label>Bottom <input id="sdkit3-outpaint-bottom" type="number" min="0" max="4096" step="8"></label><span></span>
            </div>
            <div class="outpaint-row">
                <label>Edge overlap <input id="sdkit3-outpaint-overlap" type="number" min="0" max="512" step="8"></label>
                <label>Fill
                    <select id="sdkit3-outpaint-fill">
                        <option value="mirror">Mirror edges</option>
                        <option value="stretch">Stretch edges</option>
                        <option value="noise">Noise</option>
                    </select>
                </label>
            </div>
        </section>
        <section class="outpaint-settings">
            <label>Prompt<textarea id="sdkit3-outpaint-prompt"></textarea></label>
            <label>Negative prompt<textarea id="sdkit3-outpaint-negative"></textarea></label>
            <label>Model<input id="sdkit3-outpaint-model" type="text" spellcheck="false" autocomplete="off" class="model-filter model-selector"></label>
            <label>VAE<input id="sdkit3-outpaint-vae" type="text" spellcheck="false" autocomplete="off" class="model-filter model-selector"></label>
            <label>Sampler<span id="sdkit3-outpaint-sampler-slot"></span></label>
            <label>Scheduler<span id="sdkit3-outpaint-scheduler-slot"></span></label>
            <div class="outpaint-row">
                <label>Steps <input id="sdkit3-outpaint-steps" type="number" min="1" max="500" step="1"></label>
                <label>CFG <input id="sdkit3-outpaint-cfg" type="number" min="0" max="50" step="0.1"></label>
                <label>Strength <input id="sdkit3-outpaint-strength" type="number" min="0.01" max="1" step="0.01"></label>
            </div>
            <div class="outpaint-row">
                <label>Images <input id="sdkit3-outpaint-total" type="number" min="1" max="100" step="1"></label>
                <label>Parallel <input id="sdkit3-outpaint-parallel" type="number" min="1" max="16" step="1"></label>
                <label>Seed <input id="sdkit3-outpaint-seed" type="number" min="0" max="4294967295" step="1"></label>
            </div>
        </section>
    </div>
    <div class="outpaint-actions">
        <button value="cancel" class="secondaryButton">Cancel</button>
        <button id="sdkit3-outpaint-apply" value="default" class="primaryButton"><i class="fa-solid fa-expand"></i> Generate outpaint</button>
    </div>
</form>
