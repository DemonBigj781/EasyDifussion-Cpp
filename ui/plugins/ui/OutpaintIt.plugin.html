<h4 class="collapsible">Outpaint It Settings
    <i id="reset-op-settings" class="fa-solid fa-arrow-rotate-left section-button" role="button" tabindex="0">
        <span class="simple-tooltip top-left">Reset Outpaint It Settings</span>
    </i>
</h4>
<div id="outpaintit-settings-entries" class="collapsible-content" style="display: block; margin-top: 15px;">
    <div><ul style="padding-left: 0;">
        <li><b class="settings-subheader">OutpaintIt Settings</b></li>
        <li class="pl-5">
            <div class="input-toggle">
                <input id="outpaintit_change_model" name="outpaintit_change_model" type="checkbox">
                <label for="outpaintit_change_model"></label>
            </div>
            <label for="outpaintit_change_model">Use model selected above <small>(not the original model)</small></label>
        </li>
        <li class="pl-5">
            <div class="input-toggle">
                <input id="outpaintit_change_prompt" name="outpaintit_change_prompt" type="checkbox">
                <label for="outpaintit_change_prompt"></label>
            </div>
            <label for="outpaintit_change_prompt">Use new prompt above <small>(not the original prompt)</small></label>
        </li>
        <li class="pl-5">
            <div class="input-toggle">
                <input id="outpaintit_change_sampler" name="outpaintit_change_sampler" type="checkbox">
                <label for="outpaintit_change_sampler"></label>
            </div>
            <label for="outpaintit_change_sampler">Use new sampler above <small>(not the original sampler)</small></label>
        </li>
        <li class="pl-5">
            <div class="input-toggle">
                <input id="outpaintit_extend_image" name="outpaintit_extend_image" type="checkbox">
                <label for="outpaintit_extend_image"></label>
            </div>
            <label for="outpaintit_extend_image">Extend image into new area <small>(with noise)</small></label>
        </li>
    </ul></div>
</div>
