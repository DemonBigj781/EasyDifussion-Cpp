<h4 class="collapsible">Perchance Image</h4>
<div class="collapsible-content" style="display:block;margin-top:15px;">
    <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;">
        <span data-perchance-status style="font-size:12px;opacity:.8;">Checking launcher…</span>
        <span data-perchance-output-dir style="font-size:11px;opacity:.65;overflow-wrap:anywhere;"></span>
        <a data-perchance-release hidden target="_blank" rel="noopener" style="font-size:11px;"></a>
    </div>
    <label for="perchance-generator-image-prompt" style="font-size:12px;">Positive prompt</label>
    <textarea id="perchance-generator-image-prompt" rows="4" style="display:block;width:100%;" placeholder="Describe the image to generate"></textarea>
    <label style="display:block;font-size:12px;margin-top:8px;">Negative prompt
        <textarea id="perchance-generator-negative-prompt" rows="2" style="display:block;width:100%;"></textarea>
    </label>
    <div id="perchance-generator-image-result" style="display:none;margin-top:12px;">
        <div id="perchance-generator-image-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-top:8px;">
        <label style="font-size:12px;">Shape
            <select id="perchance-generator-shape" style="display:block;width:100%;">
                <option value="square">square</option>
                <option value="portrait">portrait</option>
                <option value="landscape">landscape</option>
            </select>
        </label>
        <label style="font-size:12px;">Seed
            <input id="perchance-generator-seed" type="number" step="1" value="-1" style="display:block;width:100%;">
        </label>
        <label style="font-size:12px;">Guidance scale
            <input id="perchance-generator-guidance-scale" type="number" step="0.1" value="7" style="display:block;width:100%;">
        </label>
        <label style="font-size:12px;">Generation amount
            <input id="perchance-generator-amount" type="number" min="1" max="20" step="1" value="1" style="display:block;width:100%;">
        </label>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-top:8px;">
        <button id="perchance-generator-import-image-prompt" class="secondaryButton" style="justify-self:start;">Import Prompt</button>
        <button id="perchance-generator-image-button" class="primaryButton" data-perchance-action style="justify-self:center;">Generate Image</button>
        <button id="perchance-generator-export-image-prompt" class="secondaryButton" style="justify-self:end;">Export Prompt</button>
    </div>
</div>
