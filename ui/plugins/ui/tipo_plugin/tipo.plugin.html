<h4 class="collapsible">TIPO Prompt Generator</h4>
<div class="collapsible-content" style="display:block;margin-top:15px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;">
        <div id="z-tipo-status" style="font-size:12px;opacity:.8;">Idle</div>
    </div>
    <div style="display:grid;gap:10px;grid-template-columns:1fr 1fr;">
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Tag Prompt</label>
            <textarea id="z-tipo-tags" rows="4" placeholder="1girl, looking at viewer, ..."></textarea>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">TIPO Natural Language Prompt</label>
            <textarea id="z-tipo-nl" rows="4" placeholder="Describe the scene in sentences"></textarea>
            <small id="z-tipo-nl-info" style="opacity:.75;">Used by native TIPO models as short/long text conditioning.</small>
        </div>
    </div>
    <div style="margin-top:10px;display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr;">
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Ban Tags (comma-separated)</label>
            <input id="z-tipo-ban" type="text" placeholder="nsfw, lowres">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Model</label>
            <select id="z-tipo-model"></select>
            <small id="z-tipo-model-info" style="opacity:.75;"></small>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Device</label>
            <select id="z-tipo-device"><option value="cpu">cpu</option><option value="cuda">cuda</option></select>
        </div>
    </div>
    <details style="margin-top:10px;">
        <summary style="cursor:pointer;font-size:12px;">Advanced Options</summary>
        <div style="margin-top:10px;display:grid;gap:10px;grid-template-columns:repeat(4,1fr);">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Tag Length</label>
                <select id="z-tipo-tag-length">
                    <option value="very_short">very short</option><option value="short">short</option>
                    <option value="long">long</option><option value="very_long">very long</option>
                </select>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">NL Length</label>
                <select id="z-tipo-nl-length">
                    <option value="very_short">very short</option><option value="short">short</option>
                    <option value="long">long</option><option value="very_long">very long</option>
                </select>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Temperature</label>
                <input id="z-tipo-temp" type="number" step="0.01" min="0" max="2">
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Seed (-1 random)</label>
                <input id="z-tipo-seed" type="number" step="1">
            </div>
        </div>
        <div style="margin-top:10px;display:grid;gap:10px;grid-template-columns:repeat(3,1fr);">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Top P</label>
                <input id="z-tipo-top-p" type="number" step="0.01" min="0" max="1">
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Min P</label>
                <input id="z-tipo-min-p" type="number" step="0.01" min="0" max="1">
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label style="font-size:12px;">Top K</label>
                <input id="z-tipo-top-k" type="number" step="1" min="1">
            </div>
        </div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Prompt Format</label>
            <textarea id="z-tipo-format" rows="6"></textarea>
        </div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
            <button id="z-tipo-reload" class="secondaryButton">Reload Models</button>
        </div>
    </details>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button id="z-tipo-use-prompt" class="secondaryButton">Use Current Prompt as Tags</button>
        <button id="z-tipo-generate" class="primaryButton">Generate with TIPO</button>
        <button id="z-tipo-apply" class="secondaryButton">Apply Formatted Output</button>
        <button id="z-tipo-apply-raw" class="secondaryButton">Apply Unformatted Output</button>
    </div>
    <div style="margin-top:10px;display:grid;gap:10px;grid-template-columns:1fr 1fr;">
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Formatted Output</label>
            <textarea id="z-tipo-output" rows="4" readonly></textarea>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12px;">Unformatted Output</label>
            <textarea id="z-tipo-output-raw" rows="4" readonly></textarea>
        </div>
    </div>
</div>
