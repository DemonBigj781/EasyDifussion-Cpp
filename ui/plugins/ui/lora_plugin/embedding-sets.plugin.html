<h4 class="collapsible">Embedding Sets <small>save and reload positive/negative selections</small></h4>
<div class="collapsible-content settings-panel-entries embedding-settings-content">
    <div class="embedding-set-row">
        <label for="embedding-set-select">Saved set:</label>
        <select id="embedding-set-select"><option value="">Choose a set...</option></select>
        <button id="embedding-set-load" class="tertiaryButton smallButton">Load</button>
        <button id="embedding-set-delete" class="tertiaryButton smallButton">Delete</button>
    </div>
    <div class="embedding-set-row">
        <label for="embedding-set-name">Set name:</label>
        <input id="embedding-set-name" type="text" autocomplete="off" placeholder="Portrait cleanup">
        <button id="embedding-set-save" class="tertiaryButton smallButton">Save current</button>
    </div>
    <small>Each set stores both hidden embedding fields. Loading a set replaces the current positive and negative embedding selections.</small>
</div>
