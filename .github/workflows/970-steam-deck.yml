name: '970 - Steam Deck (Bazzite / ROCm)'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        required: true
        default: compile
        type: choice
        options: [compile, regression, compile-and-regression]
permissions: {contents: read}
jobs:
  steam-deck-bazzite-rocm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: 'echo "Steam Deck / Bazzite / ROCm / ${{ inputs.mode }}"'
      - run: 'echo "Steam Deck is treated as a Bazzite-specific ROCm platform workflow slot; dedicated Bazzite/ROCm provisioning and build steps will be wired separately."'
