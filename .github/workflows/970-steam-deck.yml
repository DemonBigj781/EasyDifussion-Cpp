name: '970 - Steam Deck LCD (Aerith / Bazzite / ROCm)'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        required: true
        default: compile
        type: choice
        options: [compile, regression, compile-and-regression]
permissions: {contents: read}
jobs:
  steam-deck-lcd-aerith:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: 'echo "Steam Deck LCD / Aerith / Bazzite / ROCm / ${{ inputs.mode }}"'
      - run: 'echo "970 is reserved for the original Steam Deck LCD Aerith APU platform path."'
