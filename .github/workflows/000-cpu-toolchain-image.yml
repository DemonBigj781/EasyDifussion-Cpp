name: '000 - CPU Toolchain Image'

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile.cpu'
      - '.github/workflows/000-cpu-toolchain-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CPU-only toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/demonbigj781/easydifussion-cpp-cpu-toolchain:main
            ghcr.io/demonbigj781/easydifussion-cpp-cpu-toolchain:${{ github.sha }}
          cache-from: type=gha,scope=cpu-toolchain
          cache-to: type=gha,mode=max,scope=cpu-toolchain
