name: '021 - ROCm API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile']

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:theory
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Verify ROCm compiler
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/rocm/bin/hipcc
          test -f /opt/rocm/include/hip/hip_runtime_api.h
          /opt/rocm/bin/hipcc --version
      - name: Compile ROCm detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/021
          compiler=/opt/rocm/bin/hipcc
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/API.cpp/library/include
            -I/opt/rocm/include
          )
          "$compiler" "${flags[@]}" \
            -c source/API.cpp/common/api.cpp \
            -o build/021/api-common.o
          "$compiler" "${flags[@]}" \
            -c source/API.cpp/features/detect/common/detect.cpp \
            -o build/021/detect-common.o
          "$compiler" "${flags[@]}" -DEDCPP_DETECT_ROCM=1 \
            -c source/API.cpp/features/detect/rocm/definition/gpu/detect.cpp \
            -o build/021/detect-rocm-definition-gpu.o
          "$compiler" "${flags[@]}" \
            -c source/API.cpp/features/detect/rocm/translation/gpu/detect.cpp \
            -o build/021/detect-rocm-translation-gpu.o
          "$compiler" "${flags[@]}" \
            -c source/API.cpp/library/src/rocm_handler.cpp \
            -o build/021/rocm-handler.o
          echo '[021] ROCm detect definition, translation, Common, and Library sources compiled successfully'
