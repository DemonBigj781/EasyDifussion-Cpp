name: '021 - ROCm API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode: {description: 'Build mode', required: true, default: 'compile', type: choice, options: ['compile', 'Test, Vast AI']}
      vast_approval: {description: 'Paid Vast.ai test permission: type APPROVE', required: false, default: '', type: string}
      vast_offer_id: {description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected', required: false, default: '', type: string}

permissions: {contents: read, packages: write}

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:theory
      credentials: {username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v7
      - name: Verify ROCm compiler
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/rocm/bin/hipcc
          test -f /opt/rocm/include/hip/hip_runtime_api.h
          /opt/rocm/bin/hipcc --version
      - name: Compile ROCm detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/021
          compiler=/opt/rocm/bin/hipcc
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -Isource/API.cpp -Isource/API.cpp/library/include -I/opt/rocm/include)
          "$compiler" "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/021/api-common.o
          "$compiler" "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/021/detect-common.o
          "$compiler" "${flags[@]}" -DEDCPP_DETECT_ROCM=1 -c source/API.cpp/features/detect/rocm/definition/gpu/detect.cpp -o build/021/detect-rocm-definition-gpu.o
          "$compiler" "${flags[@]}" -c source/API.cpp/features/detect/rocm/translation/gpu/detect.cpp -o build/021/detect-rocm-translation-gpu.o
          "$compiler" "${flags[@]}" -c source/API.cpp/library/src/rocm_handler.cpp -o build/021/rocm-handler.o
          echo '[021] ROCm detect definition, translation, Common, and Library sources compiled successfully'
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with: {name: 'vast-api-021-${{ github.run_id }}', path: build/021, if-no-files-found: error}

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/995-vast-ai-runtime-test.yml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: rocm
      artifact_name: vast-api-021-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:theory
      test_command: 'test -d /opt/edcpp-test/build && find /opt/edcpp-test/build -type f -print -quit | grep -q . && (rocminfo || /opt/rocm/bin/rocminfo)'
    secrets: inherit
