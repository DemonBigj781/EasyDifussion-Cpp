name: '009 - CPU Easy Diffusion C++ Baseline'

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compile-current-tree:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-cpu-toolchain:main
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Show baseline source revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -f source/sdkit3-port-source/CMakeLists.txt
          cmake --version
          c++ --version
      - name: Configure current Easy Diffusion C++ tree
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S source/sdkit3-port-source \
            -B build/009-cpu-baseline \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF \
            -DSDKIT_OPENGL_BACKEND=OFF \
            -DSD_CUDA=OFF \
            -DSD_HIPBLAS=OFF \
            -DSD_METAL=OFF \
            -DSD_VULKAN=OFF \
            -DSD_OPENCL=OFF \
            -DSD_SYCL=OFF \
            -DSD_MUSA=OFF
      - name: Compile current Easy Diffusion C++ tree
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/009-cpu-baseline --target sdkit --parallel 2
