name: All Backends Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform set to test
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - both
      cuda_version:
        description: CUDA toolkit preference for the CUDA test lane
        required: true
        default: auto
        type: choice
        options:
          - auto
          - '13.2.2'
          - '12.9.2'
          - '12.8.1'

permissions:
  contents: read

jobs:
  linux-cpu:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Compile CPU backend only
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/test-cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDKIT_OPENGL_BACKEND=OFF \
            -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-cpu --target sdkit --parallel 2

  linux-cuda:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Resolve CUDA test version
        id: cuda
        shell: bash
        run: |
          requested='${{ inputs.cuda_version }}'
          if [ "$requested" = auto ]; then resolved='13.2.2'; else resolved="$requested"; fi
          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "CUDA test toolkit: $resolved"
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ steps.cuda.outputs.version }}
          method: local
          linux-local-args: '["--toolkit"]'
      - name: Compile CUDA backend only
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/test-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES='75;86;89' -DSDKIT_OPENGL_BACKEND=OFF \
            -DSD_CUDA=ON -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-cuda --target sdkit --parallel 2

  linux-oneapi:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget
      - name: Install minimum oneAPI components
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel
      - name: Compile oneAPI backend only
        shell: bash
        run: |
          set -euo pipefail
          set +u; source /opt/intel/oneapi/setvars.sh; set -u
          cmake -S source/sdkit3-port-source -B build/test-oneapi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DGGML_CCACHE=OFF -DGGML_OPENMP=OFF \
            -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_MUSA=OFF \
            -DSD_SYCL=ON -DGGML_SYCL_TARGET=INTEL -DGGML_SYCL_F16=ON -DGGML_SYCL_DNN=ON -DGGML_SYCL_SUPPORT_LEVEL_ZERO=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-oneapi --target sdkit --parallel 2

  linux-rocm:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget
      - name: Install minimum ROCm components
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.2 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rocm-dev hipblas-dev rocblas-dev
      - name: Compile ROCm backend only
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/opt/rocm/bin:$PATH
          cmake -S source/sdkit3-port-source -B build/test-rocm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=ON -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DGPU_TARGETS=gfx1030 -DAMDGPU_TARGETS=gfx1030 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-rocm --target sdkit --parallel 2

  linux-vulkan:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libvulkan-dev glslc spirv-headers
      - name: Compile Vulkan backend only
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/test-vulkan -G Ninja \
            -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=ON -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-vulkan --target sdkit --parallel 2

  linux-opengl:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgl1-mesa-dev
      - name: Compile OpenGL backend only
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/test-opengl -G Ninja \
            -DSDKIT_OPENGL_BACKEND=ON -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-opengl --target sdkit --parallel 2

  linux-opencl:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config ocl-icd-opencl-dev opencl-headers
      - name: Compile OpenCL backend only
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/test-opencl -G Ninja \
            -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=ON -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/test-opencl --target sdkit --parallel 2

  windows-cpu:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Compile Windows CPU backend only
        shell: pwsh
        run: |
          cmake -S source/sdkit3-port-source -B build/test-windows-cpu -A x64 -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/test-windows-cpu --target sdkit --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-gpu-backends:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Test Windows GPU backend wiring
        shell: pwsh
        run: |
          throw 'Windows CUDA, oneAPI, ROCm, Vulkan, OpenGL, OpenCL, and DirectML/D3D12 backend provisioning must all be wired before the all-backends Windows test can pass.'
