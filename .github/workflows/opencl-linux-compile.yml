name: OpenCL Linux Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config ocl-icd-opencl-dev opencl-headers
      - name: Compile OpenCL without running binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/linux-opencl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_OPENCL=ON -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-opencl --target sdkit --parallel 2
          test -f build/linux-opencl/bin/sdkit
