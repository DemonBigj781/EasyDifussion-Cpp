name: CUDA Linux Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install base validation dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Install CUDA toolkit only
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: local
          linux-local-args: '["--toolkit"]'
      - name: Verify ROCm and oneAPI are absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v hipcc >/dev/null 2>&1 || command -v rocminfo >/dev/null 2>&1; then echo 'ROCm detected in CUDA-only workflow.' >&2; exit 1; fi
          if command -v icx >/dev/null 2>&1 || command -v icpx >/dev/null 2>&1 || command -v dpcpp >/dev/null 2>&1; then echo 'oneAPI compiler detected in CUDA-only workflow.' >&2; exit 1; fi
          if dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -E '^(rocm-|hip-|intel-oneapi-)' >/dev/null; then echo 'ROCm or oneAPI package detected in CUDA-only workflow.' >&2; exit 1; fi
      - name: Configure only CUDA without running binaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n start.sh
          bash -n scripts/bootstrap.sh
          command -v nvcc >/dev/null
          cmake -S source/sdkit3-port-source -B build/regress-linux-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DSD_CUDA=ON \
            -DSD_HIPBLAS=OFF \
            -DSD_METAL=OFF \
            -DSD_VULKAN=OFF \
            -DSD_OPENCL=OFF \
            -DSD_SYCL=OFF \
            -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
