name: Wire xFormers CUDA once

on:
  push:
    branches: [Theory]

permissions:
  contents: write

jobs:
  wire-xformers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Theory
          fetch-depth: 0

      - name: Wire native xFormers attention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          fattn = root / 'source/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cuda/fattn.cu'
          main = root / 'source/sdkit3-port-source/src/main.cpp'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          text = fattn.read_text()
          text = replace_once(
              text,
              '#include "sage/sage-attention-sm80.cuh"\n#include "fattn.cuh"',
              '#include "sage/sage-attention-sm80.cuh"\n#include "xformers-attention.cuh"\n#include "fattn.cuh"',
              'xformers include')
          text = replace_once(
              text,
              '    BEST_FATTN_KERNEL_MMA_F16  = 400,\n    BEST_FATTN_KERNEL_SAGE_SM80 = 500,',
              '    BEST_FATTN_KERNEL_MMA_F16   = 400,\n    BEST_FATTN_KERNEL_SAGE_SM80  = 500,\n    BEST_FATTN_KERNEL_XFORMERS    = 600,',
              'xformers enum')
          text = replace_once(
              text,
              '    const ggml_tensor * mask  = dst->src[3];\n\n    if (ggml_flash_attn_ext_get_sage_attn(dst) && ggml_cuda_sage_attn_sm80_supported(device, dst)) {',
              '    const ggml_tensor * mask  = dst->src[3];\n\n    // --xformers is process-global in the server, matching the existing CLI setting.\n    // Try the native memory-efficient forward kernel first and fall through cleanly\n    // to Sage/ggml FlashAttention when the tensor contract is not supported.\n    const char * xformers_env = std::getenv("SD_CUDA_XFORMERS");\n    if (xformers_env != nullptr && xformers_env[0] == \'1\' &&\n        ggml_cuda_xformers_attn_supported(device, dst)) {\n        return BEST_FATTN_KERNEL_XFORMERS;\n    }\n\n    if (ggml_flash_attn_ext_get_sage_attn(dst) && ggml_cuda_sage_attn_sm80_supported(device, dst)) {',
              'xformers selection')
          text = replace_once(
              text,
              '        case BEST_FATTN_KERNEL_SAGE_SM80:\n            break;\n        case BEST_FATTN_KERNEL_VEC:',
              '        case BEST_FATTN_KERNEL_SAGE_SM80:\n        case BEST_FATTN_KERNEL_XFORMERS:\n            break;\n        case BEST_FATTN_KERNEL_VEC:',
              'xformers allocation')
          text = replace_once(
              text,
              '        case BEST_FATTN_KERNEL_SAGE_SM80:\n            ggml_cuda_sage_attn_sm80(ctx, dst);\n            break;\n    }',
              '        case BEST_FATTN_KERNEL_SAGE_SM80:\n            ggml_cuda_sage_attn_sm80(ctx, dst);\n            break;\n        case BEST_FATTN_KERNEL_XFORMERS:\n            ggml_cuda_xformers_attn(ctx, dst);\n            break;\n    }',
              'xformers dispatch')
          fattn.write_text(text)

          text = main.read_text()
          text = replace_once(
              text,
              '    if (args.xformers_compat) {\n        LOG_INFO("--xformers enabled native fused C++/CUDA memory-efficient attention");\n    }',
              '    if (args.xformers_compat) {\n#ifdef _WIN32\n        _putenv_s("SD_CUDA_XFORMERS", "1");\n#else\n        setenv("SD_CUDA_XFORMERS", "1", 1);\n#endif\n        LOG_INFO("--xformers enabled native fused C++/CUDA memory-efficient attention");\n    }',
              'xformers CLI activation')
          main.write_text(text)

          # Static invariants: the kernel source is picked up automatically by the existing *.cu glob.
          assert 'ggml_cuda_xformers_attn_supported(device, dst)' in fattn.read_text()
          assert 'ggml_cuda_xformers_attn(ctx, dst)' in fattn.read_text()
          assert 'SD_CUDA_XFORMERS' in main.read_text()
          PY

          git diff --check
          grep -q 'xformers-attention.cuh' source/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cuda/fattn.cu
          grep -q 'BEST_FATTN_KERNEL_XFORMERS' source/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cuda/fattn.cu
          grep -q 'SD_CUDA_XFORMERS' source/sdkit3-port-source/src/main.cpp

      - name: Commit wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wire-xformers-once.yml
          git add source/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cuda/fattn.cu \
                  source/sdkit3-port-source/src/main.cpp
          git commit -m 'Wire native xFormers CUDA attention dispatch'
          git push origin HEAD:Theory
