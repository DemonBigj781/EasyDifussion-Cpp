name: Windows Regression

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend API regression lane
        required: true
        default: cpu
        type: choice
        options:
          - oneapi
          - cuda
          - rocm
          - vulkan
          - opencl
          - directml-d3d12
          - cpu

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and backend configuration without executing built binaries
        shell: pwsh
        run: |
          $backend = '${{ github.event.inputs.backend }}'
          switch ($backend) {
            'cpu' {
              cmake -S source/sdkit3-port-source -B build/regress-windows-cpu -A x64 -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            'oneapi' { throw 'Windows oneAPI regression toolchain provisioning is not wired yet.' }
            'cuda' { throw 'Windows CUDA regression toolchain provisioning is not wired yet.' }
            'rocm' { throw 'Windows ROCm/HIP regression toolchain provisioning is not wired yet.' }
            'vulkan' { throw 'Windows Vulkan regression toolchain provisioning is not wired yet.' }
            'opencl' { throw 'Windows OpenCL regression toolchain provisioning is not wired yet.' }
            'directml-d3d12' { throw 'DirectML / D3D12 regression backend implementation is not wired yet.' }
          }
