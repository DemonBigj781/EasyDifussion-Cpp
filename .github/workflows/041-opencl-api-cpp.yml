name: '041 - OpenCL API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile']

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-opencl-toolchain:theory
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Verify OpenCL compiler headers
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          test -f /usr/include/CL/cl.h
      - name: Compile OpenCL detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/041
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -DCL_TARGET_OPENCL_VERSION=120
            -Isource/API.cpp
            -Isource/API.cpp/library/include
          )
          c++ "${flags[@]}" \
            -c source/API.cpp/common/api.cpp \
            -o build/041/api-common.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/detect/common/detect.cpp \
            -o build/041/detect-common.o
          for device in cpu gpu npu; do
            c++ "${flags[@]}" -DEDCPP_DETECT_OPENCL=1 \
              -c "source/API.cpp/features/detect/opencl/definition/${device}/detect.cpp" \
              -o "build/041/detect-opencl-definition-${device}.o"
            c++ "${flags[@]}" \
              -c "source/API.cpp/features/detect/opencl/translation/${device}/detect.cpp" \
              -o "build/041/detect-opencl-translation-${device}.o"
          done
          c++ "${flags[@]}" \
            -c source/API.cpp/library/src/opencl_handler.cpp \
            -o build/041/opencl-handler.o
          echo '[041] OpenCL detect definitions, translations, Common, and Library sources compiled successfully'
