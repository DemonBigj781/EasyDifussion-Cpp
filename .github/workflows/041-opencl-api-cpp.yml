name: '041 - OpenCL API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode: {description: 'Build mode', required: true, default: 'compile', type: choice, options: ['compile', 'Test, Vast AI']}
      vast_approval: {description: 'Paid Vast.ai test permission: type APPROVE', required: false, default: '', type: string}
      vast_offer_id: {description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected', required: false, default: '', type: string}

permissions: {contents: read, packages: write}

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-opencl-toolchain:theory
      credentials: {username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v7
      - name: Verify OpenCL compiler headers
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          test -f /usr/include/CL/cl.h
      - name: Compile OpenCL detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/041
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -DCL_TARGET_OPENCL_VERSION=120 -Isource/API.cpp -Isource/API.cpp/library/include)
          c++ "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/041/api-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/041/detect-common.o
          for device in cpu gpu npu; do
            c++ "${flags[@]}" -DEDCPP_DETECT_OPENCL=1 -c "source/API.cpp/features/detect/opencl/definition/${device}/detect.cpp" -o "build/041/detect-opencl-definition-${device}.o"
            c++ "${flags[@]}" -c "source/API.cpp/features/detect/opencl/translation/${device}/detect.cpp" -o "build/041/detect-opencl-translation-${device}.o"
          done
          c++ "${flags[@]}" -c source/API.cpp/library/src/opencl_handler.cpp -o build/041/opencl-handler.o
          echo '[041] OpenCL detect definitions, translations, Common, and Library sources compiled successfully'
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with: {name: 'vast-api-041-${{ github.run_id }}', path: build/041, if-no-files-found: error}

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/995-vast-ai-runtime-test.yml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: opencl
      artifact_name: vast-api-041-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-opencl-toolchain:theory
      test_command: 'test -d /opt/edcpp-test/build && find /opt/edcpp-test/build -type f -print -quit | grep -q . && (clinfo || true)'
    secrets: inherit
