name: CPU Linux Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Compile CPU without running binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/linux-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-cpu --target sdkit --parallel 2
          test -f build/linux-cpu/bin/sdkit
