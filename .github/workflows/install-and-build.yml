name: Backend Compile Validation

# CI is intentionally manual-only and compile-only.
# It must never run generated binaries or infer runtime support from CI.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend API to compile
        required: true
        default: oneapi
        type: choice
        options:
          - oneapi
          - cuda
          - rocm
          - vulkan
          - opencl
          - metal
          - cpu-linux
          - cpu-windows
          - all

permissions:
  contents: read

concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.backend }}
  cancel-in-progress: true

env:
  SDKIT_SOURCE: source/sdkit3-port-source

jobs:
  oneapi:
    name: Compile oneAPI / SYCL
    if: github.event.inputs.backend == 'oneapi' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install base build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gnupg wget

      - name: Add Intel oneAPI repository
        shell: bash
        run: |
          set -euo pipefail
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update

      - name: Install oneAPI compile toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-compiler-dpcpp-cpp \
            intel-oneapi-mkl-devel \
            intel-oneapi-dnnl-devel

      - name: Configure oneAPI / SYCL
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake -S "$SDKIT_SOURCE" -B build/oneapi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DSD_SYCL=ON \
            -DGGML_SYCL_TARGET=INTEL \
            -DGGML_SYCL_F16=ON \
            -DGGML_SYCL_DNN=ON \
            -DGGML_SYCL_SUPPORT_LEVEL_ZERO=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF

      - name: Compile oneAPI / SYCL
        shell: bash
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake --build build/oneapi --target sdkit --parallel 2

      - name: Verify compile outputs exist without executing them
        shell: bash
        run: test -f build/oneapi/bin/sdkit

  cuda:
    name: Compile CUDA
    if: github.event.inputs.backend == 'cuda' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: local
          linux-local-args: '["--toolkit"]'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Configure CUDA
        run: |
          cmake -S "$SDKIT_SOURCE" -B build/cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_CUDA=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile CUDA
        run: cmake --build build/cuda --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/cuda/bin/sdkit

  rocm:
    name: Compile ROCm / HIP
    if: github.event.inputs.backend == 'rocm' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ROCm repository and compile toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.2 noble main' \
            | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            rocm-dev hipblas-dev rocblas-dev
      - name: Configure ROCm / HIP
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/opt/rocm/bin:$PATH
          cmake -S "$SDKIT_SOURCE" -B build/rocm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DSD_HIPBLAS=ON \
            -DGPU_TARGETS=gfx1030 \
            -DAMDGPU_TARGETS=gfx1030 \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile ROCm / HIP
        run: cmake --build build/rocm --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/rocm/bin/sdkit

  vulkan:
    name: Compile Vulkan
    if: github.event.inputs.backend == 'vulkan' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev glslc spirv-headers
      - name: Configure Vulkan
        run: |
          cmake -S "$SDKIT_SOURCE" -B build/vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_VULKAN=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile Vulkan
        run: cmake --build build/vulkan --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/vulkan/bin/sdkit

  opencl:
    name: Compile OpenCL
    if: github.event.inputs.backend == 'opencl' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            ocl-icd-opencl-dev opencl-headers
      - name: Configure OpenCL
        run: |
          cmake -S "$SDKIT_SOURCE" -B build/opencl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_OPENCL=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile OpenCL
        run: cmake --build build/opencl --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/opencl/bin/sdkit

  metal:
    name: Compile Metal
    if: github.event.inputs.backend == 'metal' || github.event.inputs.backend == 'all'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure Metal
        run: |
          cmake -S "$SDKIT_SOURCE" -B build/metal \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_METAL=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile Metal
        run: cmake --build build/metal --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/metal/bin/sdkit

  cpu-linux:
    name: Compile CPU Linux
    if: github.event.inputs.backend == 'cpu-linux' || github.event.inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Configure CPU Linux
        run: |
          cmake -S "$SDKIT_SOURCE" -B build/cpu-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile CPU Linux
        run: cmake --build build/cpu-linux --target sdkit --parallel 2
      - name: Verify compile outputs exist without executing them
        run: test -f build/cpu-linux/bin/sdkit

  cpu-windows:
    name: Compile CPU Windows
    if: github.event.inputs.backend == 'cpu-windows' || github.event.inputs.backend == 'all'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU Windows
        shell: pwsh
        run: |
          cmake -S "$env:SDKIT_SOURCE" -B build/cpu-windows -A x64 `
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF `
            -DSDKIT_BUILD_NATIVE_VISION=OFF
      - name: Compile CPU Windows
        shell: pwsh
        run: cmake --build build/cpu-windows --target sdkit --config Release --parallel 2
      - name: Verify compile outputs exist without executing them
        shell: pwsh
        run: |
          if (-not (Test-Path "build/cpu-windows/bin/Release/sdkit.exe") -and -not (Test-Path "build/cpu-windows/bin/sdkit.exe")) {
            throw "sdkit.exe was not produced"
          }
