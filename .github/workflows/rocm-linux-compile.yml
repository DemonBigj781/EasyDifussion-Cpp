name: ROCm Linux Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies and ROCm only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.2 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rocm-dev hipblas-dev rocblas-dev
      - name: Verify CUDA and oneAPI are absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v nvcc >/dev/null 2>&1; then echo 'CUDA detected in ROCm-only workflow.' >&2; exit 1; fi
          if command -v icx >/dev/null 2>&1 || command -v icpx >/dev/null 2>&1 || command -v dpcpp >/dev/null 2>&1; then echo 'oneAPI compiler detected in ROCm-only workflow.' >&2; exit 1; fi
          if dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep -E '^(cuda-|nvidia-cuda|intel-oneapi-)' >/dev/null; then echo 'CUDA or oneAPI package detected in ROCm-only workflow.' >&2; exit 1; fi
      - name: Compile only ROCm without running binaries
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/opt/rocm/bin:$PATH
          cmake -S source/sdkit3-port-source -B build/linux-rocm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DSD_CUDA=OFF \
            -DSD_HIPBLAS=ON \
            -DSD_METAL=OFF \
            -DSD_VULKAN=OFF \
            -DSD_OPENCL=OFF \
            -DSD_SYCL=OFF \
            -DSD_MUSA=OFF \
            -DGPU_TARGETS=gfx1030 \
            -DAMDGPU_TARGETS=gfx1030 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-rocm --target sdkit --parallel 2
          test -f build/linux-rocm/bin/sdkit
