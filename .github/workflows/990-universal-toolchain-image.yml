name: '990 - Universal Toolchain Image'

on:
  workflow_dispatch:
  push:
    branches: [Theory]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/devcontainer.json'
      - '.github/workflows/090-shared-toolchain-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish shared Easy Diffusion C++ toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/demonbigj781/easydifussion-cpp-api-toolchain:theory
            ghcr.io/demonbigj781/easydifussion-cpp-api-toolchain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
