name: '101 - Vulkan API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Vulkan compiler headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libvulkan-dev
          c++ --version
          test -f /usr/include/vulkan/vulkan.h
      - name: Compile Vulkan detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/101
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/API.cpp/library/include
          )
          c++ "${flags[@]}" \
            -c source/API.cpp/common/api.cpp \
            -o build/101/api-common.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/detect/common/detect.cpp \
            -o build/101/detect-common.o
          for device in cpu gpu; do
            c++ "${flags[@]}" -DEDCPP_DETECT_VULKAN=1 \
              -c "source/API.cpp/features/detect/vulkan/definition/${device}/detect.cpp" \
              -o "build/101/detect-vulkan-definition-${device}.o"
            c++ "${flags[@]}" \
              -c "source/API.cpp/features/detect/vulkan/translation/${device}/detect.cpp" \
              -o "build/101/detect-vulkan-translation-${device}.o"
          done
          c++ "${flags[@]}" \
            -c source/API.cpp/library/src/vulkan_handler.cpp \
            -o build/101/vulkan-handler.o
          echo '[101] Vulkan detect definitions, translations, Common, and Library sources compiled successfully'
