name: '020 - ROCm Toolchain Image'
on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: 'Exact ROCm version (6.0.x through 7.x)'
        required: true
        default: '7.2.4'
        type: string
      ubuntu_version:
        description: 'Ubuntu base version'
        required: true
        default: '24.04'
        type: choice
        options: ['20.04', '22.04', '24.04']
      rocm_library_profile:
        description: 'Native ROCm library set'
        required: true
        default: 'full'
        type: choice
        options: ['core', 'hip-sdk', 'ml-sdk', 'full']
      python_version:
        description: 'Python via pyenv (or none)'
        required: true
        default: 'none'
        type: choice
        options: ['none', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      pytorch_version:
        description: 'Exact PyTorch version, or none'
        required: true
        default: 'none'
        type: string
      pytorch_index_url:
        description: 'ROCm PyTorch wheel index URL, or none'
        required: true
        default: 'none'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      ROCM_VERSION: ${{ inputs.rocm_version }}
      UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
      ROCM_LIBRARY_PROFILE: ${{ inputs.rocm_library_profile }}
      PYTHON_VERSION: ${{ inputs.python_version }}
      PYTORCH_VERSION: ${{ inputs.pytorch_version }}
      PYTORCH_INDEX_URL: ${{ inputs.pytorch_index_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Resolve and validate selections
        shell: bash
        run: |
          set -euo pipefail
          case "$UBUNTU_VERSION" in
            20.04) codename=focal ;;
            22.04) codename=jammy ;;
            24.04) codename=noble ;;
            *) echo "Unsupported Ubuntu version: $UBUNTU_VERSION" >&2; exit 1 ;;
          esac
          echo "UBUNTU_CODENAME=$codename" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re
          value=os.environ['ROCM_VERSION']
          m=re.fullmatch(r'(\d+)\.(\d+)(?:\.(\d+))?', value)
          if not m:
              raise SystemExit(f'Invalid ROCm version format: {value}')
          major=int(m.group(1))
          if major not in (6,7):
              raise SystemExit(f'ROCm {value} is outside supported 020 range 6.x through 7.x')
          py=os.environ['PYTHON_VERSION']
          if py not in {'none','3.8','3.9','3.10','3.11','3.12','3.13','3.14'}:
              raise SystemExit(f'Unsupported Python selection: {py}')
          if os.environ['PYTORCH_VERSION'] != 'none' and py == 'none':
              raise SystemExit('PyTorch cannot be enabled when Python is disabled')
          print(f"[020] ROCm={value} Ubuntu={os.environ['UBUNTU_VERSION']} Libraries={os.environ['ROCM_LIBRARY_PROFILE']} Python={py} PyTorch={os.environ['PYTORCH_VERSION']}")
          PY
      - name: Verify ROCm Ubuntu repository exists
        shell: bash
        run: |
          set -euo pipefail
          url="https://repo.radeon.com/rocm/apt/${ROCM_VERSION}/dists/${UBUNTU_CODENAME}/Release"
          echo "[020] checking $url"
          curl -fsSI "$url" >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ROCm toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.rocm
          push: true
          build-args: |
            ROCM_VERSION=${{ env.ROCM_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            UBUNTU_CODENAME=${{ env.UBUNTU_CODENAME }}
            ROCM_LIBRARY_PROFILE=${{ env.ROCM_LIBRARY_PROFILE }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            PYTORCH_VERSION=${{ env.PYTORCH_VERSION }}
            PYTORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
          tags: |
            ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:theory
            ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:rocm-${{ env.ROCM_VERSION }}-ubuntu-${{ env.UBUNTU_VERSION }}-${{ env.ROCM_LIBRARY_PROFILE }}
            ghcr.io/demonbigj781/easydifussion-cpp-rocm-toolchain:${{ github.sha }}
          cache-from: type=gha,scope=rocm-toolchain
          cache-to: type=gha,mode=min,scope=rocm-toolchain
