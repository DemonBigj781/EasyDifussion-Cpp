name: '83 - Steam Deck'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mode
        required: true
        default: compile
        type: choice
        options: [compile, regression, compile-and-regression]
      backend:
        description: Backend
        required: true
        default: rocm
        type: choice
        options: [rocm, vulkan, opengl]
permissions: {contents: read}
jobs:
  steam-deck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: 'echo "Steam Deck / ${{ inputs.backend }} / ${{ inputs.mode }}"'
      - run: 'echo "Steam Deck remains an isolated platform workflow slot until its dedicated provisioning/build path is wired."'
