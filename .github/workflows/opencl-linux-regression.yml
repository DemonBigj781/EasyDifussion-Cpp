name: OpenCL Linux Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL validation dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config ocl-icd-opencl-dev opencl-headers
      - name: Configure OpenCL without running binaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n start.sh
          bash -n scripts/bootstrap.sh
          cmake -S source/sdkit3-port-source -B build/regress-linux-opencl -G Ninja -DSD_OPENCL=ON -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
