name: '111 - OpenGL API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode: {description: 'Build mode', required: true, default: 'compile', type: choice, options: ['compile', 'Test, Vast AI']}
      vast_approval: {description: 'Paid Vast.ai test permission: type APPROVE', required: false, default: '', type: string}
      vast_offer_id: {description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected', required: false, default: '', type: string}

permissions: {contents: read, packages: write}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenGL compiler headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgl-dev
          c++ --version
          test -f /usr/include/GL/gl.h
      - name: Compile OpenGL detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/111
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -Isource/API.cpp -Isource/API.cpp/library/include)
          c++ "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/111/api-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/111/detect-common.o
          c++ "${flags[@]}" -DEDCPP_DETECT_OPENGL=1 -c source/API.cpp/features/detect/opengl/definition/gpu/detect.cpp -o build/111/detect-opengl-definition-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/opengl/translation/gpu/detect.cpp -o build/111/detect-opengl-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/opengl_handler.cpp -o build/111/opengl-handler.o
          echo '[111] OpenGL detect definition, translation, Common, and Library sources compiled successfully'
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with: {name: 'vast-api-111-${{ github.run_id }}', path: build/111, if-no-files-found: error}

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/995-vast-ai-runtime-test.yml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: opengl
      artifact_name: vast-api-111-${{ github.run_id }}
      base_image: ''
    secrets: inherit
