name: '111 - OpenGL API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenGL compiler headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgl-dev
          c++ --version
          test -f /usr/include/GL/gl.h
      - name: Compile OpenGL detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/111
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/API.cpp/library/include
          )
          c++ "${flags[@]}" \
            -c source/API.cpp/common/api.cpp \
            -o build/111/api-common.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/detect/common/detect.cpp \
            -o build/111/detect-common.o
          c++ "${flags[@]}" -DEDCPP_DETECT_OPENGL=1 \
            -c source/API.cpp/features/detect/opengl/definition/gpu/detect.cpp \
            -o build/111/detect-opengl-definition-gpu.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/detect/opengl/translation/gpu/detect.cpp \
            -o build/111/detect-opengl-translation-gpu.o
          c++ "${flags[@]}" \
            -c source/API.cpp/library/src/opengl_handler.cpp \
            -o build/111/opengl-handler.o
          echo '[111] OpenGL detect definition, translation, Common, and Library sources compiled successfully'
