name: Linux oneAPI Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install base build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget

      - name: Install oneAPI toolchain only
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel

          if command -v nvcc >/dev/null 2>&1; then
            echo 'ERROR: CUDA nvcc is present after oneAPI-only provisioning.' >&2
            exit 1
          fi

          if dpkg-query -W -f='${Package}\n' 2>/dev/null | grep -E '^(nvidia-cuda-toolkit|cuda-toolkit|cuda-toolkit-[0-9-]+|cuda-compiler|cuda-compiler-[0-9-]+)$' >/dev/null; then
            echo 'ERROR: A CUDA toolkit/compiler package was installed by the oneAPI workflow.' >&2
            exit 1
          fi

      - name: Compile only the oneAPI backend without running binaries
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh
          set -u
          cmake -S source/sdkit3-port-source -B build/linux-oneapi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DGGML_CCACHE=OFF \
            -DSD_CUDA=OFF \
            -DSD_HIPBLAS=OFF \
            -DSD_METAL=OFF \
            -DSD_VULKAN=OFF \
            -DSD_OPENCL=OFF \
            -DSD_MUSA=OFF \
            -DSD_SYCL=ON \
            -DGGML_SYCL_TARGET=INTEL \
            -DGGML_SYCL_F16=ON \
            -DGGML_SYCL_DNN=ON \
            -DGGML_SYCL_SUPPORT_LEVEL_ZERO=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF \
            -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-oneapi --target sdkit --parallel 2
          test -f build/linux-oneapi/bin/sdkit
