name: Linux Compile

on:
  workflow_dispatch:
    inputs:
      gpu_1:
        description: GPU 1
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_2:
        description: GPU 2
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_3:
        description: GPU 3
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_4:
        description: GPU 4
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_5:
        description: GPU 5
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_6:
        description: GPU 6
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_7:
        description: GPU 7
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      gpu_8:
        description: GPU 8
        required: true
        default: none
        type: choice
        options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]
      cuda_version:
        description: Preferred CUDA toolkit; automatically downgraded when selected GPUs require an older supported version
        required: true
        default: auto
        type: choice
        options: [auto, '13.2.2', '12.9.2', '12.8.1']

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Install base build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget

      - name: Resolve selected hardware and backend targets
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t GPUS < <(printf '%s\n' '${{ inputs.gpu_1 }}' '${{ inputs.gpu_2 }}' '${{ inputs.gpu_3 }}' '${{ inputs.gpu_4 }}' '${{ inputs.gpu_5 }}' '${{ inputs.gpu_6 }}' '${{ inputs.gpu_7 }}' '${{ inputs.gpu_8 }}' | grep -v '^none$' | sort -u)
          if [ "${#GPUS[@]}" -eq 0 ]; then echo 'Select at least one GPU.' >&2; exit 2; fi

          declare -A CUDA=() ONEAPI=() ROCM=()
          CUDA_MAX_MAJOR=13
          HAS_CUDA=0
          for gpu in "${GPUS[@]}"; do
            case "$gpu" in
              p102-100) CUDA[61-real]=1; CUDA_MAX_MAJOR=12; HAS_CUDA=1 ;;
              tesla-p100) CUDA[60-real]=1; CUDA_MAX_MAJOR=12; HAS_CUDA=1 ;;
              tesla-v100) CUDA[70-real]=1; CUDA_MAX_MAJOR=12; HAS_CUDA=1 ;;
              quadro-rtx-4000|rtx-2080-ti) CUDA[75-real]=1; HAS_CUDA=1 ;;
              a100) CUDA[80-real]=1; HAS_CUDA=1 ;;
              rtx-3060|nvidia-a2) CUDA[86-real]=1; HAS_CUDA=1 ;;
              rtx-4090) CUDA[89-real]=1; HAS_CUDA=1 ;;
              h100) CUDA[90-real]=1; HAS_CUDA=1 ;;
              b200) CUDA[100-real]=1; HAS_CUDA=1 ;;
              rtx-5090) CUDA[120-real]=1; HAS_CUDA=1 ;;
              xg310) ONEAPI[jit]=1 ;;
              arc-a770|arc-a750|arc-a580) ONEAPI[acm-g10]=1 ;;
              arc-a380|arc-a310) ONEAPI[acm-g11]=1 ;;
              flex-170) ONEAPI[ats-m150]=1 ;;
              flex-140) ONEAPI[ats-m75]=1 ;;
              max-1550|max-1100) ONEAPI[pvc]=1 ;;
              rx-6800|rx-6900-xt) ROCM[gfx1030]=1 ;;
              mi50) ROCM[gfx906]=1 ;;
              mi100) ROCM[gfx908]=1 ;;
              mi200) ROCM[gfx90a]=1 ;;
              *) echo "Unknown GPU: $gpu" >&2; exit 2 ;;
            esac
          done

          join_keys() { local -n ref=$1; if [ "${#ref[@]}" -eq 0 ]; then echo ''; else printf '%s\n' "${!ref[@]}" | sort | paste -sd';' -; fi; }
          cuda="$(join_keys CUDA)"; oneapi="$(join_keys ONEAPI)"; rocm="$(join_keys ROCM)"

          CUDA_VERSION=''
          if [ "$HAS_CUDA" -eq 1 ]; then
            REQUESTED='${{ inputs.cuda_version }}'
            case "$REQUESTED" in
              auto) REQUESTED_MAJOR=99 ;;
              13.*) REQUESTED_MAJOR=13 ;;
              12.*) REQUESTED_MAJOR=12 ;;
              *) echo "Unsupported CUDA preference: $REQUESTED" >&2; exit 2 ;;
            esac

            RESOLVED_MAJOR=$REQUESTED_MAJOR
            [ "$RESOLVED_MAJOR" -gt "$CUDA_MAX_MAJOR" ] && RESOLVED_MAJOR=$CUDA_MAX_MAJOR
            if [ "$RESOLVED_MAJOR" -ge 13 ]; then
              CUDA_VERSION='13.2.2'
            else
              case "$REQUESTED" in
                12.8.1) CUDA_VERSION='12.8.1' ;;
                *) CUDA_VERSION='12.9.2' ;;
              esac
            fi
            echo "CUDA requested: $REQUESTED"
            echo "CUDA compatibility ceiling from selected GPUs: ${CUDA_MAX_MAJOR}.x"
            echo "CUDA resolved: $CUDA_VERSION"
          fi

          echo "cuda=$cuda" >> "$GITHUB_OUTPUT"
          echo "cuda_version=$CUDA_VERSION" >> "$GITHUB_OUTPUT"
          echo "oneapi=$oneapi" >> "$GITHUB_OUTPUT"
          echo "rocm=$rocm" >> "$GITHUB_OUTPUT"
          echo "Selected GPUs: ${GPUS[*]}"
          echo "CUDA targets: ${cuda:-none}"
          echo "oneAPI targets: ${oneapi:-none}"
          echo "ROCm targets: ${rocm:-none}"

      - name: Install CUDA toolkit when NVIDIA CUDA hardware is selected
        if: steps.resolve.outputs.cuda != ''
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '${{ steps.resolve.outputs.cuda_version }}'
          method: local
          linux-local-args: '["--toolkit"]'

      - name: Compile CUDA for all selected NVIDIA architectures
        if: steps.resolve.outputs.cuda != ''
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/sdkit3-port-source -B build/linux-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES='${{ steps.resolve.outputs.cuda }}' -DSDKIT_OPENGL_BACKEND=OFF \
            -DSD_CUDA=ON -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-cuda --target sdkit --parallel 2

      - name: Compile oneAPI for all selected Intel architectures
        if: steps.resolve.outputs.oneapi != ''
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel
          set +u; source /opt/intel/oneapi/setvars.sh; set -u
          IFS=';' read -ra ARCHES <<< '${{ steps.resolve.outputs.oneapi }}'
          for arch in "${ARCHES[@]}"; do
            builddir="build/linux-oneapi-$arch"
            extra=()
            [ "$arch" = jit ] || extra+=("-DGGML_SYCL_DEVICE_ARCH=$arch")
            cmake -S source/sdkit3-port-source -B "$builddir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DGGML_CCACHE=OFF -DGGML_OPENMP=OFF \
              -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_MUSA=OFF \
              -DSD_SYCL=ON -DGGML_SYCL_TARGET=INTEL -DGGML_SYCL_F16=ON -DGGML_SYCL_DNN=ON -DGGML_SYCL_SUPPORT_LEVEL_ZERO=ON \
              "${extra[@]}" -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
            cmake --build "$builddir" --target sdkit --parallel 2
          done

      - name: Install ROCm when AMD hardware is selected
        if: steps.resolve.outputs.rocm != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.2 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rocm-dev hipblas-dev rocblas-dev

      - name: Compile ROCm for all selected AMD architectures
        if: steps.resolve.outputs.rocm != ''
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/opt/rocm/bin:$PATH
          cmake -S source/sdkit3-port-source -B build/linux-rocm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ -DSDKIT_OPENGL_BACKEND=OFF \
            -DSD_CUDA=OFF -DSD_HIPBLAS=ON -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
            -DGPU_TARGETS='${{ steps.resolve.outputs.rocm }}' -DAMDGPU_TARGETS='${{ steps.resolve.outputs.rocm }}' -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-rocm --target sdkit --parallel 2

      - name: Compile portable Vulkan backend for selected GPUs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
          cmake -S source/sdkit3-port-source -B build/linux-vulkan -G Ninja -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=ON -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-vulkan --target sdkit --parallel 2

      - name: Compile portable OpenGL backend for selected GPUs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
          cmake -S source/sdkit3-port-source -B build/linux-opengl -G Ninja -DSDKIT_OPENGL_BACKEND=ON -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-opengl --target sdkit --parallel 2

      - name: Compile portable OpenCL backend for selected GPUs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev opencl-headers
          cmake -S source/sdkit3-port-source -B build/linux-opencl -G Ninja -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=ON -DSD_SYCL=OFF -DSD_MUSA=OFF -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
          cmake --build build/linux-opencl --target sdkit --parallel 2