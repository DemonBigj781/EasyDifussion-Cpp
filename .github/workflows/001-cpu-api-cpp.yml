name: '001 - CPU API.cpp'

"on":
  workflow_dispatch:
    inputs:
      platform: {description: Platform, required: true, default: linux, type: choice, options: [linux, windows]}
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile', 'Compile Test Code', 'Test, Vast AI']
      vast_approval:
        description: 'Paid Vast.ai test permission: type APPROVE'
        required: false
        default: ''
        type: string
      vast_offer_id:
        description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-cpu-toolchain:theory
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Verify CPU compiler
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
      - name: Compile CPU API routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/001
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/API.cpp/library/include
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/include
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/src
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cpu
          )
          c++ "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/001/api-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/001/detect-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/cpu/definition/cpu/detect.cpp -o build/001/detect-cpu-definition.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/cpu/translation/cpu/detect.cpp -o build/001/detect-cpu-translation.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cpu_handler.cpp -o build/001/cpu-handler.o
          c++ "${flags[@]}" -c source/API.cpp/features/load/common/load.cpp -o build/001/load-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/load/model/cpu/definition/cpu/load.cpp -o build/001/load-model-cpu-definition.o
          c++ "${flags[@]}" -c source/API.cpp/features/load/model/cpu/translation/cpu/load.cpp -o build/001/load-model-cpu-translation.o
          c++ "${flags[@]}" -c source/API.cpp/features/unload/common/unload.cpp -o build/001/unload-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/unload/model/cpu/definition/cpu/unload.cpp -o build/001/unload-model-cpu-definition.o
          c++ "${flags[@]}" -c source/API.cpp/features/unload/model/cpu/translation/cpu/unload.cpp -o build/001/unload-model-cpu-translation.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cpu_model_lifecycle.cpp -o build/001/cpu-model-lifecycle.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/plan.cpp -o build/001/overflow-plan-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/normalize.cpp -o build/001/overflow-normalize-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/dispatch.cpp -o build/001/overflow-dispatch-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cpu/definition/cpu/allocate.cpp -o build/001/overflow-allocate-cpu-definition.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cpu/definition/cpu/release.cpp -o build/001/overflow-release-cpu-definition.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cpu/translation/cpu/allocate.cpp -o build/001/overflow-allocate-cpu-translation.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cpu/translation/cpu/release.cpp -o build/001/overflow-release-cpu-translation.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/overflow.cpp -o build/001/overflow-library-common.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cpu_overflow.cpp -o build/001/cpu-overflow.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/common/qkt.cpp -o build/001/xformers-common-qkt.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/common/mask.cpp -o build/001/xformers-common-mask.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/common/softmax.cpp -o build/001/xformers-common-softmax.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/common/av.cpp -o build/001/xformers-common-av.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/common/forward.cpp -o build/001/xformers-common-forward.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/cpu/translation/cpu/qkt.cpp -o build/001/xformers-cpu-qkt.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/cpu/translation/cpu/mask.cpp -o build/001/xformers-cpu-mask.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/cpu/translation/cpu/softmax.cpp -o build/001/xformers-cpu-softmax.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/cpu/translation/cpu/av.cpp -o build/001/xformers-cpu-av.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/xformers/cpu/translation/cpu/forward.cpp -o build/001/xformers-cpu-forward.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/flash/common/flash_attention.cpp -o build/001/flash-attention-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/attention/flash/cpu/translation/cpu/flash_attention_cpu.cpp -o build/001/flash-attention-cpu.o
          echo '[001] CPU API/xFormers/FlashAttention routes compiled successfully'
      - name: Compile CPU test applications
        if: ${{ inputs.mode == 'Compile Test Code' || inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          make -C source/API.test \
            BUILD_DIR="$GITHUB_WORKSPACE/build/001" \
            cpu load-cpu unload-cpu overflow-cpu \
            xformers-cpu xformers-cpu-gen
          install -m 0644 \
            source/API.test/MODELS/lifecycle-model.fixture \
            build/001/lifecycle-model.fixture
          test -x build/001/xformers-load-unload-cpu-test
          test -x build/001/xformers-cpu-gen
          test -x build/001/detect-cpu
          test -x build/001/load-cpu
          test -x build/001/unload-cpu
          test -x build/001/overflow-cpu
          echo '[001] CPU Detect, lifecycle, Overflow, xFormers cycle, and generation tests compiled and linked; not executed on GitHub'
      - name: Compile and run normalized FlashAttention CPU route test
        if: ${{ inputs.mode == 'Compile Test Code' || inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/include
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/src
            -Isource/sdkit3-port-source/stable-diffusion.cpp/ggml/src/ggml-cpu
          )
          c++ "${flags[@]}" \
            source/API.test/Feature/Attention/Flash/Cpu/Main.cpp \
            source/API.cpp/features/attention/flash/common/flash_attention.cpp \
            source/API.cpp/features/attention/flash/cpu/translation/cpu/flash_attention_cpu.cpp \
            -o build/001/flash-attention-cpu-test
          build/001/flash-attention-cpu-test
      - name: Stage minimal CPU runtime artifact
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/001-vast
          install -m 0755 \
            build/001/xformers-load-unload-cpu-test \
            build/001-vast/xformers-load-unload-cpu-test
          install -m 0644 \
            build/001/lifecycle-model.fixture \
            build/001-vast/lifecycle-model.fixture
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with:
          name: vast-api-001-${{ github.run_id }}
          path: build/001-vast
          if-no-files-found: error

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/@@@-vast-ai-runtime-test.yaml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: cpu
      artifact_name: vast-api-001-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-cpu-toolchain:theory
      test_command: '/opt/edcpp-test/build/xformers-load-unload-cpu-test /opt/edcpp-test/build/lifecycle-model.fixture'
    secrets: inherit
