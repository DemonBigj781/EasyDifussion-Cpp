name: '010 - CUDA Toolchain Image'
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile.cuda'
      - '.github/workflows/010-cuda-toolchain-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CUDA toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.cuda
          push: true
          tags: |
            ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:main
            ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
