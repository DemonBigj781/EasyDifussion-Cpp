name: '010 - CUDA Toolchain Image'
on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'Exact CUDA version (11.4.x through 13.x)'
        required: true
        default: '13.3.1'
        type: string
      ubuntu_version:
        description: 'Ubuntu base version'
        required: true
        default: '24.04'
        type: choice
        options: ['20.04', '22.04', '24.04', '26.04']
      python_version:
        description: 'Python via pyenv (or none)'
        required: true
        default: 'none'
        type: choice
        options: ['none', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      pytorch_version:
        description: 'Exact PyTorch version, or none'
        required: true
        default: 'none'
        type: string
      pytorch_index_url:
        description: 'Optional PyTorch wheel index URL, or none'
        required: true
        default: 'none'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      CUDA_VERSION: ${{ inputs.cuda_version }}
      UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
      PYTHON_VERSION: ${{ inputs.python_version }}
      PYTORCH_VERSION: ${{ inputs.pytorch_version }}
      PYTORCH_INDEX_URL: ${{ inputs.pytorch_index_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Validate selections
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          cuda = os.environ['CUDA_VERSION']
          m = re.fullmatch(r'(\d+)\.(\d+)(?:\.(\d+))?', cuda)
          if not m:
              raise SystemExit(f'Invalid CUDA version format: {cuda}')
          major, minor = int(m.group(1)), int(m.group(2))
          if not ((major == 11 and minor >= 4) or major == 12 or major == 13):
              raise SystemExit(f'CUDA {cuda} is outside supported 010 range 11.4.x through 13.x')
          py = os.environ['PYTHON_VERSION']
          if py not in {'none','3.8','3.9','3.10','3.11','3.12','3.13','3.14'}:
              raise SystemExit(f'Unsupported Python selection: {py}')
          torch = os.environ['PYTORCH_VERSION']
          if torch != 'none' and py == 'none':
              raise SystemExit('PyTorch cannot be enabled when Python is disabled')
          print(f'[010] CUDA={cuda} Ubuntu={os.environ["UBUNTU_VERSION"]} Python={py} PyTorch={torch}')
          PY
      - name: Verify NVIDIA CUDA Ubuntu image exists
        shell: bash
        run: |
          set -euo pipefail
          image="nvidia/cuda:${CUDA_VERSION}-devel-ubuntu${UBUNTU_VERSION}"
          echo "[010] checking $image"
          docker buildx imagetools inspect "$image" >/dev/null
          echo "[010] compatible NVIDIA base found"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CUDA toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.cuda
          push: true
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            PYTORCH_VERSION=${{ env.PYTORCH_VERSION }}
            PYTORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
          tags: |
            ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:main
            ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:cuda-${{ env.CUDA_VERSION }}-ubuntu-${{ env.UBUNTU_VERSION }}
            ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
