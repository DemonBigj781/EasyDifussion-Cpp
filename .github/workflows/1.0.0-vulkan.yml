name: '1.0.0 - Vulkan'
on: {workflow_dispatch: {inputs: {mode: {description: Mode, required: true, default: compile, type: choice, options: [compile, regression, compile-and-regression]}, target: {description: Catalog GPU ID, required: true, default: rtx-3060, type: string}}}}
permissions: {contents: read}
jobs: {build: {runs-on: ubuntu-24.04, steps: [{uses: actions/checkout@v7}, {uses: actions/setup-python@v6, with: {python-version: '3.13'}}, {run: 'sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libvulkan-dev glslc spirv-headers'}, {shell: bash, run: 'j=$(python ci/scripts/resolve_hardware.py --backend vulkan "${{ inputs.target }}"); python ci/scripts/build_backend.py --backend vulkan --mode "${{ inputs.mode }}" --target-json "$j"'}]}}
