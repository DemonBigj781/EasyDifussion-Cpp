name: '998 - Universal Easy Diffusion C++ Pipeline'
on:
  workflow_dispatch:
    inputs:
      platform: {description: Platform, required: true, default: linux, type: choice, options: [linux, windows]}
      mode: {description: Mode, required: true, default: compile, type: choice, options: [check, compile, regression, compile-and-regression]}
      cuda_version: {description: Preferred CUDA version, required: true, default: auto, type: choice, options: [auto, '13.2.2', '12.9.2', '12.8.1']}
      gpu_1: {description: GPU 1, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_2: {description: GPU 2, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_3: {description: GPU 3, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_4: {description: GPU 4, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_5: {description: GPU 5, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_6: {description: GPU 6, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_7: {description: GPU 7, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
      gpu_8: {description: GPU 8, required: true, default: none, type: choice, options: [none, p102-100, tesla-p100, tesla-v100, quadro-rtx-4000, rtx-2080-ti, a100, rtx-3060, nvidia-a2, rtx-4090, h100, b200, rtx-5090, xg310, arc-a770, arc-a750, arc-a580, arc-a380, arc-a310, flex-170, flex-140, max-1550, max-1100, rx-6800, rx-6900-xt, mi50, mi100, mi200]}
permissions: {contents: read}
jobs:
  linux:
    if: inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Resolve hardware
        id: r
        shell: bash
        run: |
          j=$(python ci/scripts/resolve_hardware.py --cuda-version '${{ inputs.cuda_version }}' '${{ inputs.gpu_1 }}' '${{ inputs.gpu_2 }}' '${{ inputs.gpu_3 }}' '${{ inputs.gpu_4 }}' '${{ inputs.gpu_5 }}' '${{ inputs.gpu_6 }}' '${{ inputs.gpu_7 }}' '${{ inputs.gpu_8 }}')
          echo "json=$j" >> "$GITHUB_OUTPUT"
          python -c 'import json,sys; x=json.loads(sys.argv[1]); print("has_cuda="+str(bool(x["cuda"])).lower()); print("has_oneapi="+str(bool(x["oneapi"])).lower()); print("has_rocm="+str(bool(x["rocm"])).lower()); print("has_portable="+str(bool(x["portable"])).lower())' "$j" >> "$GITHUB_OUTPUT"
          echo "$j"
      - name: Install base tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget
      - name: Install CUDA
        if: steps.r.outputs.has_cuda == 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with: {cuda: '${{ fromJSON(steps.r.outputs.json).cuda_version }}', method: local, linux-local-args: '["--toolkit"]'}
      - name: Install oneAPI
        if: steps.r.outputs.has_oneapi == 'true'
        shell: bash
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel intel-ocloc libze1 libze-dev
          command -v ocloc
      - name: Install ROCm
        if: steps.r.outputs.has_rocm == 'true'
        shell: bash
        run: bash ci/scripts/setup_rocm.sh
      - name: Install portable API headers
        if: steps.r.outputs.has_portable == 'true'
        run: sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers libgl1-mesa-dev ocl-icd-opencl-dev opencl-headers
      - name: Build resolved backends
        shell: bash
        env: {TARGET_JSON: '${{ steps.r.outputs.json }}'}
        run: |
          set -euo pipefail
          if [ '${{ steps.r.outputs.has_cuda }}' = true ]; then python ci/scripts/build_backend.py --backend cuda --mode '${{ inputs.mode }}' --target-json "$TARGET_JSON"; fi
          if [ '${{ steps.r.outputs.has_oneapi }}' = true ]; then set +u; source /opt/intel/oneapi/setvars.sh; set -u; python ci/scripts/build_backend.py --backend oneapi --mode '${{ inputs.mode }}' --target-json "$TARGET_JSON"; fi
          if [ '${{ steps.r.outputs.has_rocm }}' = true ]; then export PATH=/opt/rocm/bin:$PATH; python ci/scripts/build_backend.py --backend rocm --mode '${{ inputs.mode }}' --target-json "$TARGET_JSON"; fi
          for b in $(python -c 'import json,os; print(" ".join(json.loads(os.environ["TARGET_JSON"])["portable"]))'); do python ci/scripts/build_backend.py --backend "$b" --mode '${{ inputs.mode }}' --target-json "$TARGET_JSON"; done
          if [ "$TARGET_JSON" = '{"devices":[],"cuda":[],"cuda_version":"","oneapi":[],"rocm":[],"portable":[]}' ]; then python ci/scripts/build_backend.py --backend cpu --mode '${{ inputs.mode }}' --target-json "$TARGET_JSON"; fi
  windows:
    if: inputs.platform == 'windows'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Resolve selected hardware
        shell: pwsh
        run: python ci/scripts/resolve_hardware.py --cuda-version '${{ inputs.cuda_version }}' '${{ inputs.gpu_1 }}' '${{ inputs.gpu_2 }}' '${{ inputs.gpu_3 }}' '${{ inputs.gpu_4 }}' '${{ inputs.gpu_5 }}' '${{ inputs.gpu_6 }}' '${{ inputs.gpu_7 }}' '${{ inputs.gpu_8 }}'
      - name: Windows status
        shell: pwsh
        run: |
          $selected = @('${{ inputs.gpu_1 }}','${{ inputs.gpu_2 }}','${{ inputs.gpu_3 }}','${{ inputs.gpu_4 }}','${{ inputs.gpu_5 }}','${{ inputs.gpu_6 }}','${{ inputs.gpu_7 }}','${{ inputs.gpu_8 }}') | Where-Object { $_ -ne 'none' }
          if ($selected.Count -gt 0) { throw 'Windows GPU backend provisioning remains TODO; use the dedicated backend workflows as each Windows implementation is wired.' }
          python ci/scripts/build_backend.py --backend cpu --mode '${{ inputs.mode }}' --target-json '{"devices":[],"cuda":[],"cuda_version":"","oneapi":[],"rocm":[],"portable":[]}'
