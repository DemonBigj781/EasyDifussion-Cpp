name: '031 - oneAPI API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode: {description: 'Build mode', required: true, default: 'compile', type: choice, options: ['compile', 'Test, Vast AI']}
      vast_approval: {description: 'Paid Vast.ai test permission: type APPROVE', required: false, default: '', type: string}
      vast_offer_id: {description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected', required: false, default: '', type: string}

permissions: {contents: read, packages: write}

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-oneapi-toolchain:theory
      credentials: {username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v7
      - name: Verify oneAPI compiler
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null
          set -u
          icpx --version
      - name: Compile oneAPI detect route
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null
          set -u
          mkdir -p build/031
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -fsycl -Isource/API.cpp -Isource/API.cpp/library/include)
          icpx "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/031/api-common.o
          icpx "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/031/detect-common.o
          for device in cpu gpu npu; do
            icpx "${flags[@]}" -DEDCPP_DETECT_ONEAPI=1 -c "source/API.cpp/features/detect/oneapi/definition/${device}/detect.cpp" -o "build/031/detect-oneapi-definition-${device}.o"
            icpx "${flags[@]}" -c "source/API.cpp/features/detect/oneapi/translation/${device}/detect.cpp" -o "build/031/detect-oneapi-translation-${device}.o"
          done
          icpx "${flags[@]}" -c source/API.cpp/library/src/oneapi_handler.cpp -o build/031/oneapi-handler.o
          echo '[031] oneAPI detect definitions, translations, Common, and Library sources compiled successfully'
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with: {name: 'vast-api-031-${{ github.run_id }}', path: build/031, if-no-files-found: error}

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/995-vast-ai-runtime-test.yml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: oneapi
      artifact_name: vast-api-031-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-oneapi-toolchain:theory
      test_command: 'test -d /opt/edcpp-test/build && find /opt/edcpp-test/build -type f -print -quit | grep -q . && bash -lc "set +u; source /opt/intel/oneapi/setvars.sh >/dev/null; set -u; (sycl-ls || true); icpx --version"'
    secrets: inherit
