name: '031 - oneAPI API.cpp'

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile']

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-oneapi-toolchain:theory
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Verify oneAPI compiler
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null
          set -u
          icpx --version
      - name: Compile oneAPI detect route
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null
          set -u
          mkdir -p build/031
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic -fsycl
            -Isource/API.cpp
            -Isource/API.cpp/library/include
          )
          icpx "${flags[@]}" \
            -c source/API.cpp/common/api.cpp \
            -o build/031/api-common.o
          icpx "${flags[@]}" \
            -c source/API.cpp/features/detect/common/detect.cpp \
            -o build/031/detect-common.o
          for device in cpu gpu npu; do
            icpx "${flags[@]}" -DEDCPP_DETECT_ONEAPI=1 \
              -c "source/API.cpp/features/detect/oneapi/definition/${device}/detect.cpp" \
              -o "build/031/detect-oneapi-definition-${device}.o"
            icpx "${flags[@]}" \
              -c "source/API.cpp/features/detect/oneapi/translation/${device}/detect.cpp" \
              -o "build/031/detect-oneapi-translation-${device}.o"
          done
          icpx "${flags[@]}" \
            -c source/API.cpp/library/src/oneapi_handler.cpp \
            -o build/031/oneapi-handler.o
          echo '[031] oneAPI detect definitions, translations, Common, and Library sources compiled successfully'
