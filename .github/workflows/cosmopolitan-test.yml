name: Cosmopolitan all-in-one integration
run-name: One Easy Diffusion APE - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [cosmopolitan-test]
    paths:
      - cosmopolitan/**
      - '!cosmopolitan/vast/**'
      - .github/workflows/cosmopolitan-test.yml
      - .gitignore

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  LLVM_COSMO_JOBS: 2
  LAVAPIPE_JOBS: 2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build one application with shared GGML and both Vulkan providers
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      executable_sha256: ${{ steps.package.outputs.executable_sha256 }}
      model_sha256: ${{ steps.package.outputs.model_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the runner's host build prerequisites
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, subprocess, sys, tempfile, venv
          from pathlib import Path
          commands = ('cc', 'c++', 'make', 'git', 'curl', 'tar', 'xz', 'gzip',
                      'unzip', 'patch', 'sha256sum', 'nm', 'ar', 'file', 'false')
          missing = [name for name in commands if shutil.which(name) is None]
          if missing:
              raise RuntimeError('Runner is missing required host tools: ' + ', '.join(missing))
          if sys.version_info < (3, 12):
              raise RuntimeError('The Ubuntu 24.04 build requires Python 3.12 or later')
          with tempfile.TemporaryDirectory(prefix='cosmo-host-check-') as temporary:
              root = Path(temporary)
              venv.EnvBuilder(with_pip=True).create(root / 'venv')
              source = root / 'compiler.cpp'
              source.write_text('#include <string>\nint main() { return std::string("ok").size() != 2; }\n')
              subprocess.run(['c++', '-std=c++20', str(source), '-o', str(root / 'compiler')], check=True)
              subprocess.run([str(root / 'compiler')], check=True)
          print('Host C++20 compiler, archive tools and Python venv are available')
          PY
      - name: Restore the pinned SDK and host tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            cosmopolitan/out/downloads
            cosmopolitan/out/sdk
            cosmopolitan/out/tools
          key: cosmo-easydiffusion-ubuntu24-sdk4.0.2-tools-v1
      - name: Check the native Generate adapter's asynchronous behavior
        shell: bash
        run: |
          node cosmopolitan/tests/verify_inference_ui.js
          node cosmopolitan/tests/verify_config_ui.js
      - name: Restore the pinned software WebGPU dependency build
        id: software-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cosmopolitan/out/software-webgpu
          key: cosmo-easydiffusion-webgpu-ubuntu24-v1-${{ hashFiles('cosmopolitan/software-webgpu/**', 'cosmopolitan/backend/patches/**') }}
          restore-keys: |
            cosmo-easydiffusion-webgpu-ubuntu24-v1-
      - name: Build and validate the pinned software WebGPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cosmopolitan/out
          {
            if [ '${{ steps.software-cache.outputs.cache-hit }}' != 'true' ]; then
              python3 cosmopolitan/build.py --prepare-only
              python3 cosmopolitan/software-webgpu/prepare.py --stage rust --jobs 2
              python3 cosmopolitan/software-webgpu/prepare.py --stage llvm --jobs 4
              python3 cosmopolitan/software-webgpu/prepare.py --stage mesa --jobs 4
              python3 cosmopolitan/software-webgpu/prepare.py --stage manifest --jobs 2
            fi
            python3 cosmopolitan/build.py --dependencies-only --jobs 2
          } 2>&1 | tee cosmopolitan/out/software-dependencies.log
      - name: Save the validated driver and compiler before the application build
        if: steps.software-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cosmopolitan/out/software-webgpu
          key: ${{ steps.software-cache.outputs.cache-primary-key }}
      - name: Verify persistent configuration, device policy and Linux native thread execution
        shell: bash
        run: |
          set -euo pipefail
          python3 cosmopolitan/tests/build_config_probe.py
          python3 cosmopolitan/tests/verify_config.py \
            --probe cosmopolitan/out/config-test/config-probe.exe \
            --loader cosmopolitan/out/ape-x86_64.elf > cosmopolitan/out/config-test/report.json
          python3 cosmopolitan/tests/verify_device_policy.py --build > cosmopolitan/out/device-policy-report.json
          python3 cosmopolitan/tests/verify_native_main_executor.py
          rustc --edition=2021 --test \
            cosmopolitan/out/software-webgpu/foundation/o/webgpu/source/src/cosmo_adapter_enumeration.rs \
            -o cosmopolitan/out/adapter-enumeration-test
          cosmopolitan/out/adapter-enumeration-test > cosmopolitan/out/adapter-enumeration-test.log
      - name: Compile and embed application resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cosmopolitan/out
          python3 cosmopolitan/build.py --jobs 2 2>&1 | tee cosmopolitan/out/build.log
      - name: Verify shared symbols and package identity
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 cosmopolitan/tests/audit_symbols.py --out cosmopolitan/out
          cp cosmopolitan/tests/verify_runtime.py cosmopolitan/out/verify_runtime.py
          cp cosmopolitan/tests/verify_bootstrap.py cosmopolitan/out/verify_bootstrap.py
          cp cosmopolitan/tests/verify_inference.py cosmopolitan/out/verify_inference.py
          cp cosmopolitan/tests/verify_inference_api.py cosmopolitan/out/verify_inference_api.py
          cp cosmopolitan/tests/verify_webgpu_device.py cosmopolitan/out/verify_webgpu_device.py
          cp cosmopolitan/tests/verify_windows_native_discovery.py cosmopolitan/out/verify_windows_native_discovery.py
          cp cosmopolitan/tests/verify_configuration_api.py cosmopolitan/out/verify_configuration_api.py
          cp cosmopolitan/tests/verify_config.py cosmopolitan/out/verify_config.py
          cp cosmopolitan/tests/verify_device_policy.py cosmopolitan/out/verify_device_policy.py
          cp cosmopolitan/out/config-test/config-probe.exe cosmopolitan/out/config-probe.exe
          cp cosmopolitan/out/config-test/BUILD.json cosmopolitan/out/CONFIG_PROBE_BUILD.json
          cp cosmopolitan/out/device-policy-test/device-policy-test.exe cosmopolitan/out/device-policy-test.exe
          cp cosmopolitan/out/device-policy-test/BUILD.json cosmopolitan/out/DEVICE_POLICY_BUILD.json
          cp cosmopolitan/inference/fetch_model.py cosmopolitan/out/fetch_inference_model.py
          cp cosmopolitan/inference/PIN.json cosmopolitan/out/PIN.json
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'cosmopolitan/tests')
          from verify_runtime import verify_package
          directory = Path('cosmopolitan/out')
          digest = verify_package(directory, None)
          model_pin = json.loads((directory / 'PIN.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'executable_sha256={digest}\n')
              output.write(f'model_sha256={model_pin["sha256"]}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### One application artifact\n\n')
              summary.write(f'SHA-256: `{digest}`\n\n')
              summary.write('Windows and Linux execute this file without rebuilding it. ')
              summary.write('The executable contains wgpu-native, Mesa lavapipe and LLVM and can also use the installed native Vulkan driver. Embedded-provider jobs require trained text and image inference, WebGPU dispatch during denoising, and native generation API lifecycle checks. A separate Linux job verifies the native loader, dual-provider graph execution and image inference using an explicitly identified host software driver. These CI runners do not establish physical GPU support. Configuration and selector probes are separate from shader/inference evidence. The pinned SD 1.5 weights are external test data.\n')
          PY
      - name: Upload the application for both operating systems
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easy-diffusion-cosmopolitan-x86_64
          path: |
            cosmopolitan/out/easy-diffusion.exe
            cosmopolitan/out/ape-x86_64.elf
            cosmopolitan/out/BUILD.json
            cosmopolitan/out/SYMBOLS.json
            cosmopolitan/out/software-webgpu/LINK.json
            cosmopolitan/out/verify_runtime.py
            cosmopolitan/out/verify_bootstrap.py
            cosmopolitan/out/verify_inference.py
            cosmopolitan/out/verify_inference_api.py
            cosmopolitan/out/verify_webgpu_device.py
            cosmopolitan/out/verify_windows_native_discovery.py
            cosmopolitan/out/verify_configuration_api.py
            cosmopolitan/out/verify_config.py
            cosmopolitan/out/verify_device_policy.py
            cosmopolitan/out/config-probe.exe
            cosmopolitan/out/CONFIG_PROBE_BUILD.json
            cosmopolitan/out/device-policy-test.exe
            cosmopolitan/out/DEVICE_POLICY_BUILD.json
            cosmopolitan/out/fetch_inference_model.py
            cosmopolitan/out/PIN.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-build-diagnostics
          path: |
            cosmopolitan/out/build.log
            cosmopolitan/out/software-dependencies.log
            cosmopolitan/out/easy-diffusion.com.dbg
            cosmopolitan/out/build/CMakeFiles/CMakeConfigureLog.yaml
            cosmopolitan/out/software-webgpu/*.log
            cosmopolitan/out/software-webgpu/foundation/o/llvm-cosmo/*.log
            cosmopolitan/out/software-webgpu/foundation/o/lavapipe/*.log
            cosmopolitan/out/config-test/report.json
            cosmopolitan/out/device-policy-report.json
            cosmopolitan/out/native-main-executor-test/report.json
            cosmopolitan/out/native-main-executor-test/*.log
            cosmopolitan/out/adapter-enumeration-test.log
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux application in an empty filesystem
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA256: ${{ needs.build.outputs.executable_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-diffusion-cosmopolitan-x86_64
          path: artifact
      - name: Run shared-GGML WebGPU inference, CPU math, server and UI without host libraries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/ape-x86_64.elf artifact/easy-diffusion.exe
          sudo python3 artifact/verify_runtime.py --artifact-dir "$PWD/artifact" \
            --expected-sha256 "$EXPECTED_SHA256" --isolate
      - name: Launch the single application file through its bundled Linux bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 artifact/verify_bootstrap.py --artifact-dir "$PWD/artifact" \
            --expected-sha256 "$EXPECTED_SHA256"
      - name: Verify persistent configuration through the actual native HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 artifact/verify_configuration_api.py --artifact-dir artifact \
            --output-dir artifact/results-configuration-api
      - name: Restore the external pinned diffusion checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifact/inference-models
          key: cosmo-sd15-inference-v1-${{ needs.build.outputs.model_sha256 }}
          enableCrossOsArchive: true
      - name: Fetch and verify the external trained checkpoint
        timeout-minutes: 20
        shell: bash
        run: python3 artifact/fetch_inference_model.py --model-dir artifact/inference-models
      - name: Generate images on CPU and embedded software WebGPU
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          directory = Path('artifact').resolve()
          pin = json.loads((directory / 'PIN.json').read_text())
          model = directory / 'inference-models' / pin['filename']
          for backend in ('cpu', 'webgpu'):
              subprocess.run([sys.executable, str(directory / 'verify_inference.py'),
                              '--artifact-dir', str(directory), '--model', str(model),
                              '--backend', backend, '--timeout', '1800',
                              '--steps', '2' if backend == 'webgpu' else '4',
                              '--output-dir', str(directory / ('results-inference-' + backend))], check=True)
          subprocess.run([sys.executable, str(directory / 'verify_inference_api.py'),
                          '--artifact-dir', str(directory), '--model', str(model),
                          '--output-dir', str(directory / 'results-inference-api')], check=True)
          PY
      - name: Preserve Linux results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-linux-results
          path: |
            artifact/results-linux-isolated
            artifact/results-linux-bootstrap
            artifact/results-inference-cpu
            artifact/results-inference-webgpu
            artifact/results-inference-api
            artifact/results-configuration-api
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows native PE with the identical application
    needs: build
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      EXPECTED_SHA256: ${{ needs.build.outputs.executable_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-diffusion-cosmopolitan-x86_64
          path: artifact
      - name: Run the PE directly from a clean application directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifact/verify_runtime.py --artifact-dir artifact
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows runtime verification failed' }
      - name: Run the identical configuration and device policy probes on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifact/verify_config.py --probe artifact/config-probe.exe > artifact/config-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows configuration module verification failed' }
          python artifact/verify_device_policy.py --probe artifact/device-policy-test.exe > artifact/device-policy-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows device policy verification failed' }
          python artifact/verify_configuration_api.py --artifact-dir artifact `
            --output-dir artifact/results-configuration-api
          if ($LASTEXITCODE -ne 0) { throw 'Windows persistent configuration HTTP verification failed' }
      - name: Verify the native Windows Vulkan DLL path and unsupported-device rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifact/verify_windows_native_discovery.py --artifact-dir artifact `
            --output-dir artifact/results-windows-native-discovery
          if ($LASTEXITCODE -ne 0) { throw 'Windows native Vulkan discovery/rejection verification failed' }
      - name: Restore the external pinned diffusion checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifact/inference-models
          key: cosmo-sd15-inference-v1-${{ needs.build.outputs.model_sha256 }}
          enableCrossOsArchive: true
      - name: Fetch and verify the external trained checkpoint
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifact/fetch_inference_model.py --model-dir artifact/inference-models
          if ($LASTEXITCODE -ne 0) { throw 'Pinned diffusion checkpoint verification failed' }
      - name: Generate images on CPU and embedded software WebGPU
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelPin = Get-Content artifact/PIN.json -Raw | ConvertFrom-Json
          $modelPath = Join-Path artifact/inference-models $modelPin.filename
          foreach ($backend in @('cpu', 'webgpu')) {
            $sampleSteps = if ($backend -eq 'webgpu') { 2 } else { 4 }
            python artifact/verify_inference.py --artifact-dir artifact --model $modelPath `
              --backend $backend --steps $sampleSteps --timeout 1800 --output-dir "artifact/results-inference-$backend"
            if ($LASTEXITCODE -ne 0) { throw "Native Windows $backend image inference failed" }
          }
          python artifact/verify_inference_api.py --artifact-dir artifact --model $modelPath `
            --output-dir artifact/results-inference-api
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows inference API lifecycle verification failed' }
      - name: Preserve Windows results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-windows-results
          path: |
            artifact/results-windows
            artifact/results-inference-cpu
            artifact/results-inference-webgpu
            artifact/results-inference-api
            artifact/results-configuration-api
            artifact/config-report.json
            artifact/device-policy-report.json
            artifact/results-windows-native-discovery
          if-no-files-found: ignore
          retention-days: 30

  linux_native:
    name: Linux native Vulkan loader and software-driver inference
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA256: ${{ needs.build.outputs.executable_sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-diffusion-cosmopolitan-x86_64
          path: artifact
      - name: Install and identify the host Vulkan software driver
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/ape-x86_64.elf artifact/easy-diffusion.exe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
          python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = list(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          if len(candidates) != 1:
              raise RuntimeError('Expected exactly one host lavapipe ICD: ' + repr(candidates))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('NATIVE_ICD=' + str(candidates[0]) + '\n')
          PY
          dpkg-query -W libvulkan1 mesa-vulkan-drivers > artifact/native-driver-packages.txt
      - name: Execute native-driver graphs and trained text inference with software classification
        shell: bash
        run: |
          set -euo pipefail
          python3 artifact/verify_webgpu_device.py --artifact-dir artifact \
            --provider native --device WebGPU0 --vulkan-icd "$NATIVE_ICD" \
            --output-dir artifact/results-native-device
          python3 artifact/verify_webgpu_device.py --artifact-dir artifact \
            --provider auto --all --vulkan-icd "$NATIVE_ICD" \
            --output-dir artifact/results-dual-provider
      - name: Restore the external pinned diffusion checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifact/inference-models
          key: cosmo-sd15-inference-v1-${{ needs.build.outputs.model_sha256 }}
          enableCrossOsArchive: true
      - name: Fetch and verify the external trained checkpoint
        timeout-minutes: 20
        shell: bash
        run: python3 artifact/fetch_inference_model.py --model-dir artifact/inference-models
      - name: Execute image inference through the Linux main-thread native driver path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          directory = Path('artifact').resolve()
          pin = json.loads((directory / 'PIN.json').read_text())
          model = directory / 'inference-models' / pin['filename']
          subprocess.run([sys.executable, str(directory / 'verify_inference_api.py'),
                          '--artifact-dir', str(directory), '--model', str(model),
                          '--backend', 'webgpu', '--provider', 'native', '--device', 'WebGPU0',
                          '--vulkan-icd', os.environ['NATIVE_ICD'], '--steps', '2', '--skip-cancel',
                          '--output-dir', str(directory / 'results-native-inference-api')], check=True)
          PY
      - name: Preserve native driver results with actual adapter classification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmopolitan-linux-native-results
          path: |
            artifact/native-driver-packages.txt
            artifact/results-native-device
            artifact/results-dual-provider
            artifact/results-native-inference-api
          if-no-files-found: ignore
          retention-days: 30
