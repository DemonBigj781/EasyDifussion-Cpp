name: '051 - OpenVINO API.cpp'

"on":
  workflow_dispatch:
    inputs:
      platform: {description: Platform, required: true, default: linux, type: choice, options: [linux, windows]}
      mode: {description: 'Build mode', required: true, default: 'compile', type: choice, options: ['compile', 'Compile Test Code', 'Test, Vast AI']}
      vast_approval: {description: 'Paid Vast.ai test permission: type APPROVE', required: false, default: '', type: string}
      vast_offer_id: {description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected', required: false, default: '', type: string}

permissions: {contents: read, packages: write}

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-openvino-toolchain:theory
      credentials: {username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
    steps:
      - uses: actions/checkout@v7
      - name: Verify OpenVINO compiler headers
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          header="$(find /usr /opt -path '*/openvino/openvino.hpp' -print -quit 2>/dev/null)"
          test -n "$header"
          echo "OPENVINO_INCLUDE=${header%/openvino/openvino.hpp}" >> "$GITHUB_ENV"
          library="$(find /usr /opt -name 'libopenvino.so' -print -quit 2>/dev/null)"
          test -n "$library"
          echo "OPENVINO_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Compile OpenVINO detect route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/051
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -Isource/API.cpp -Isource/API.cpp/library/include "-I${OPENVINO_INCLUDE}")
          c++ "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/051/api-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/051/detect-common.o
          for device in cpu gpu npu; do
            c++ "${flags[@]}" -DEDCPP_DETECT_OPENVINO=1 -c "source/API.cpp/features/detect/openvino/definition/${device}/detect.cpp" -o "build/051/detect-openvino-definition-${device}.o"
            c++ "${flags[@]}" -c "source/API.cpp/features/detect/openvino/translation/${device}/detect.cpp" -o "build/051/detect-openvino-translation-${device}.o"
          done
          c++ "${flags[@]}" -c source/API.cpp/features/detect/openvino/translation/register.cpp -o build/051/detect-openvino-register.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/openvino_handler.cpp -o build/051/openvino-handler.o
          echo '[051] OpenVINO detect definitions, translations, Common, and Library sources compiled successfully'
      - name: Compile OpenVINO Detect test application
        if: ${{ inputs.mode == 'Compile Test Code' || inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(-std=c++17 -Wall -Wextra -Wpedantic -DEDCPP_DETECT_OPENVINO=1 -Isource/API.cpp -Isource/API.cpp/library/include "-I${OPENVINO_INCLUDE}")
          c++ "${flags[@]}" \
            source/API.test/Detect/openvino/detect.cpp \
            source/API.cpp/features/detect/common/detect.cpp \
            source/API.cpp/features/detect/openvino/definition/cpu/detect.cpp \
            source/API.cpp/features/detect/openvino/definition/gpu/detect.cpp \
            source/API.cpp/features/detect/openvino/definition/npu/detect.cpp \
            source/API.cpp/features/detect/openvino/translation/cpu/detect.cpp \
            source/API.cpp/features/detect/openvino/translation/gpu/detect.cpp \
            source/API.cpp/features/detect/openvino/translation/npu/detect.cpp \
            source/API.cpp/features/detect/openvino/translation/register.cpp \
            source/API.cpp/library/src/openvino_handler.cpp \
            "$OPENVINO_LIBRARY" \
            -o build/051/detect-openvino-test
          test -x build/051/detect-openvino-test
          echo '[051] OpenVINO Detect test compiled and linked; runtime deferred to an approved unavailable-local-runtime test'
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with: {name: 'vast-api-051-${{ github.run_id }}', path: build/051, if-no-files-found: error}

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/@@@-vast-ai-runtime-test.yaml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: openvino
      artifact_name: vast-api-051-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-openvino-toolchain:theory
      test_command: '/opt/edcpp-test/build/detect-openvino-test'
    secrets: inherit
