name: Linux Regression

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend API regression lane
        required: true
        default: oneapi
        type: choice
        options:
          - oneapi
          - oneapi-cpu
          - cuda
          - rocm
          - vulkan
          - opengl
          - opencl
          - cpu
      nvidia_device:
        description: NVIDIA device to configure for (used only when backend is cuda)
        required: true
        default: rtx-3060
        type: choice
        options:
          - p102-100
          - tesla-p100
          - tesla-v100
          - jetson-xavier
          - quadro-rtx-4000
          - rtx-2080-ti
          - a100
          - rtx-3060
          - nvidia-a2
          - jetson-orin
          - rtx-4090
          - h100
          - b200
          - rtx-5090

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install base validation dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config gnupg wget

      - name: Install CUDA toolkit for CUDA regression lane
        if: github.event.inputs.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: local
          linux-local-args: '["--toolkit"]'

      - name: Install ROCm toolchain for ROCm regression lane
        if: github.event.inputs.backend == 'rocm'
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2.2 noble main' | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rocm-dev hipblas-dev rocblas-dev

      - name: Validate source and selected backend configuration without executing built binaries
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n start.sh
          bash -n scripts/bootstrap.sh

          setup_oneapi() {
            wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "$@"
            set +u
            source /opt/intel/oneapi/setvars.sh
            set -u
          }

          cuda_arch_for_device() {
            case "$1" in
              p102-100) echo 61 ;;
              tesla-p100) echo 60 ;;
              tesla-v100) echo 70 ;;
              jetson-xavier) echo 72 ;;
              quadro-rtx-4000|rtx-2080-ti) echo 75 ;;
              a100) echo 80 ;;
              rtx-3060|nvidia-a2) echo 86 ;;
              jetson-orin) echo 87 ;;
              rtx-4090) echo 89 ;;
              h100) echo 90 ;;
              b200) echo 100 ;;
              rtx-5090) echo 120 ;;
              *) return 1 ;;
            esac
          }

          case "${{ github.event.inputs.backend }}" in
            oneapi)
              setup_oneapi intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel
              cmake -S source/sdkit3-port-source -B build/regress-linux-oneapi -G Ninja \
                -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DGGML_CCACHE=OFF -DGGML_OPENMP=OFF -DSDKIT_OPENGL_BACKEND=OFF \
                -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_MUSA=OFF \
                -DSD_SYCL=ON -DGGML_SYCL_TARGET=INTEL -DGGML_SYCL_F16=ON -DGGML_SYCL_DNN=ON -DGGML_SYCL_SUPPORT_LEVEL_ZERO=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            oneapi-cpu)
              setup_oneapi intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel
              cmake -S source/sdkit3-port-source -B build/regress-linux-oneapi-cpu -G Ninja \
                -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DGGML_CCACHE=OFF -DGGML_OPENMP=OFF -DSDKIT_OPENGL_BACKEND=OFF \
                -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Intel10_64lp_seq -DGGML_NATIVE=ON \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            cuda)
              command -v nvcc >/dev/null
              CUDA_ARCH="$(cuda_arch_for_device '${{ github.event.inputs.nvidia_device }}')" || { echo 'Unknown NVIDIA device selection' >&2; exit 2; }
              echo "Configuring for ${{ github.event.inputs.nvidia_device }} (SM ${CUDA_ARCH})"
              cmake -S source/sdkit3-port-source -B build/regress-linux-cuda -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH} -DSDKIT_OPENGL_BACKEND=OFF \
                -DSD_CUDA=ON -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            rocm)
              export PATH=/opt/rocm/bin:$PATH
              cmake -S source/sdkit3-port-source -B build/regress-linux-rocm -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ -DSDKIT_OPENGL_BACKEND=OFF \
                -DSD_CUDA=OFF -DSD_HIPBLAS=ON -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DGPU_TARGETS=gfx1030 -DAMDGPU_TARGETS=gfx1030 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            vulkan)
              sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
              cmake -S source/sdkit3-port-source -B build/regress-linux-vulkan -G Ninja \
                -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=ON -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            opengl)
              sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
              cmake -S source/sdkit3-port-source -B build/regress-linux-opengl -G Ninja \
                -DSDKIT_OPENGL_BACKEND=ON -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            opencl)
              sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev opencl-headers
              cmake -S source/sdkit3-port-source -B build/regress-linux-opencl -G Ninja \
                -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=ON -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
            cpu)
              cmake -S source/sdkit3-port-source -B build/regress-linux-cpu -G Ninja \
                -DSDKIT_OPENGL_BACKEND=OFF -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF \
                -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
              ;;
          esac
