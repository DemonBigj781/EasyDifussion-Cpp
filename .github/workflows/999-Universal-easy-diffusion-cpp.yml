name: '999 - Universal Complete Compile [RESERVED]'
on:
  workflow_dispatch:
    inputs:
      mode: {description: Mode, required: true, default: check, type: choice, options: [check, compile]}
permissions: {contents: read}
jobs:
  reserved:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: echo '999 is reserved for the universal complete compile after the universal API.cpp, llama.cpp, and Easy Diffusion C++ paths are wired.'
