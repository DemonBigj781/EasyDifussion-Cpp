name: JetPack 5 Compile

on:
  workflow_dispatch:
    inputs:
      backend:
        description: JetPack 5 backend to compile
        required: true
        default: cuda
        type: choice
        options:
          - cuda
          - opengl
          - vulkan

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Compile selected JetPack 5 backend only
        shell: bash
        run: |
          set -euo pipefail
          backend='${{ github.event.inputs.backend }}'
          docker run --rm --platform linux/arm64 -e BACKEND="$backend" -v "$PWD:/workspace" -w /workspace nvcr.io/nvidia/l4t-jetpack:r35.4.1 bash -lc '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
            case "$BACKEND" in
              cuda)
                cmake -S source/sdkit3-port-source -B build/jetpack5-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES="72;87" -DSD_CUDA=ON -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=OFF -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
                cmake --build build/jetpack5-cuda --target sdkit --parallel 2
                test -f build/jetpack5-cuda/bin/sdkit
                ;;
              vulkan)
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
                cmake -S source/sdkit3-port-source -B build/jetpack5-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_CUDA=OFF -DSD_HIPBLAS=OFF -DSD_METAL=OFF -DSD_VULKAN=ON -DSD_OPENCL=OFF -DSD_SYCL=OFF -DSD_MUSA=OFF -DSDKIT_BUILD_LLAMA_RUNTIME=OFF -DSDKIT_BUILD_NATIVE_VISION=OFF
                cmake --build build/jetpack5-vulkan --target sdkit --parallel 2
                test -f build/jetpack5-vulkan/bin/sdkit
                ;;
              opengl)
                echo "OpenGL backend implementation is not wired yet." >&2
                exit 2
                ;;
            esac
          '
