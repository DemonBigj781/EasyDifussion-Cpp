name: '011 - CUDA API.cpp'

"on":
  workflow_dispatch:
    inputs:
      platform: {description: Platform, required: true, default: linux, type: choice, options: [linux, windows]}
      mode:
        description: 'Build mode'
        required: true
        default: 'compile'
        type: choice
        options: ['compile', 'Compile Test Code', 'Test, Vast AI']
      vast_approval:
        description: 'Paid Vast.ai test permission: type APPROVE'
        required: false
        default: ''
        type: string
      vast_offer_id:
        description: 'Vast.ai offer ID to rent only when Test, Vast AI is selected'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:theory
      credentials:
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7
      - name: Verify API ownership boundaries
        run: python3 scripts/test_api_boundaries.py
      - name: Verify CUDA toolchain image
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/local/cuda/include/cuda_runtime_api.h
          test -x /usr/local/cuda/bin/nvcc
          /usr/local/cuda/bin/nvcc --version
      - name: Compile CUDA API routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/011
          flags=(
            -std=c++17 -Wall -Wextra -Wpedantic
            -Isource/API.cpp
            -Isource/API.cpp/library/include
            -I/usr/local/cuda/include
          )
          c++ "${flags[@]}" -c source/API.cpp/common/api.cpp -o build/011/api-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/common/detect.cpp -o build/011/detect-common.o
          c++ "${flags[@]}" -DEDCPP_DETECT_CUDA=1 -c source/API.cpp/features/detect/cuda/definition/gpu/detect.cpp -o build/011/detect-cuda-definition-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/detect/cuda/translation/gpu/detect.cpp -o build/011/detect-cuda-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cuda_handler.cpp -o build/011/cuda-handler.o
          c++ "${flags[@]}" -c source/API.cpp/features/load/common/load.cpp -o build/011/load-common.o
          c++ "${flags[@]}" -DEDCPP_LOAD_CUDA=1 -c source/API.cpp/features/load/model/cuda/definition/gpu/load.cpp -o build/011/load-model-cuda-definition-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/load/model/cuda/translation/gpu/load.cpp -o build/011/load-model-cuda-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/unload/common/unload.cpp -o build/011/unload-common.o
          c++ "${flags[@]}" -DEDCPP_UNLOAD_CUDA=1 -c source/API.cpp/features/unload/model/cuda/definition/gpu/unload.cpp -o build/011/unload-model-cuda-definition-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/unload/model/cuda/translation/gpu/unload.cpp -o build/011/unload-model-cuda-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cuda_model_lifecycle.cpp -o build/011/cuda-model-lifecycle.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/plan.cpp -o build/011/overflow-plan-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/normalize.cpp -o build/011/overflow-normalize-common.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/common/dispatch.cpp -o build/011/overflow-dispatch-common.o
          c++ "${flags[@]}" -DEDCPP_OVERFLOW_CUDA=1 -c source/API.cpp/features/overflow/cuda/definition/gpu/allocate.cpp -o build/011/overflow-allocate-cuda-definition-gpu.o
          c++ "${flags[@]}" -DEDCPP_OVERFLOW_CUDA=1 -c source/API.cpp/features/overflow/cuda/definition/gpu/release.cpp -o build/011/overflow-release-cuda-definition-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cuda/translation/gpu/allocate.cpp -o build/011/overflow-allocate-cuda-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/features/overflow/cuda/translation/gpu/release.cpp -o build/011/overflow-release-cuda-translation-gpu.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/overflow.cpp -o build/011/overflow-library-common.o
          c++ "${flags[@]}" -c source/API.cpp/library/src/cuda_overflow.cpp -o build/011/cuda-overflow.o
          for unit in qkt mask softmax av forward; do
            c++ "${flags[@]}" -c "source/API.cpp/features/attention/xformers/common/${unit}.cpp" -o "build/011/xformers-common-${unit}.o"
            c++ "${flags[@]}" -c "source/API.cpp/features/attention/xformers/cuda/definition/gpu/${unit}.cpp" -o "build/011/xformers-cuda-definition-${unit}.o"
          done
          nvcc -std=c++17 -Isource/API.cpp \
            -c source/API.cpp/features/attention/xformers/cuda/translation/gpu/forward.cu \
            -o build/011/xformers-cuda-translation-forward.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/attention/flash/common/flash_attention.cpp \
            -o build/011/flash-attention-common.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/attention/flash/cuda/definition/gpu/flash_attention_cuda.cpp \
            -o build/011/flash-attention-cuda-definition.o
          nvcc -std=c++17 -Isource/API.cpp \
            -c source/API.cpp/features/attention/flash/cuda/translation/gpu/forward.cu \
            -o build/011/flash-attention-cuda-translation-forward.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/attention/sage/common/sage_attention.cpp \
            -o build/011/sage-attention-common.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/attention/sage/cuda/definition/gpu/sage_attention_cuda.cpp \
            -o build/011/sage-attention-cuda-definition.o
          c++ "${flags[@]}" \
            -c source/API.cpp/features/attention/sage/cuda/translation/gpu/support.cpp \
            -o build/011/sage-attention-cuda-support-translation.o
          echo '[011] CUDA detect, model lifecycle, Overflow, Common xFormers, Common FlashAttention, and Sage support routes compiled successfully'
      - name: Compile CUDA test applications
        if: ${{ inputs.mode == 'Compile Test Code' || inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          make -C source/API.test \
            BUILD_DIR="$GITHUB_WORKSPACE/build/011" \
            cuda load-cuda unload-cuda overflow-cuda \
            xformers-cuda xformers-cuda-gen \
            flash-cuda flash-cuda-roundtrip flash-cuda-gen \
            sage-cuda-support
          install -m 0644 \
            source/API.test/MODELS/lifecycle-model.fixture \
            build/011/lifecycle-model.fixture
          test -x build/011/xformers-load-unload-cuda-test
          test -x build/011/xformers-cuda-gen
          test -x build/011/flash-attention-cuda-test
          test -x build/011/flash-api-roundtrip-cuda-test
          test -x build/011/flash-cuda-gen
          test -x build/011/sage-cuda-support-test
          build/011/sage-cuda-support-test
          test -x build/011/detect-cuda
          test -x build/011/load-cuda
          test -x build/011/unload-cuda
          test -x build/011/overflow-cuda
          echo '[011] CUDA Detect, lifecycle, Overflow, xFormers cycle/generation, FlashAttention feature/roundtrip/generation, and Sage support tests compiled and linked; CPU-only Sage support contract executed on GitHub'
      - name: Stage minimal CUDA runtime artifact
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/011-vast
          install -m 0755 \
            build/011/xformers-load-unload-cuda-test \
            build/011-vast/xformers-load-unload-cuda-test
          install -m 0755 \
            build/011/flash-attention-cuda-test \
            build/011-vast/flash-attention-cuda-test
          install -m 0755 \
            build/011/flash-api-roundtrip-cuda-test \
            build/011-vast/flash-api-roundtrip-cuda-test
          install -m 0644 \
            build/011/lifecycle-model.fixture \
            build/011-vast/lifecycle-model.fixture
      - name: Preserve GitHub-compiled artifact for approved Vast.ai test
        if: ${{ inputs.mode == 'Test, Vast AI' }}
        uses: actions/upload-artifact@v4
        with:
          name: vast-api-011-${{ github.run_id }}
          path: build/011-vast
          if-no-files-found: error

  vast-test:
    if: ${{ inputs.mode == 'Test, Vast AI' }}
    needs: build
    uses: ./.github/workflows/@@@-vast-ai-runtime-test.yaml
    with:
      approval: ${{ inputs.vast_approval }}
      offer_id: ${{ inputs.vast_offer_id }}
      backend: cuda
      artifact_name: vast-api-011-${{ github.run_id }}
      base_image: ghcr.io/demonbigj781/easydifussion-cpp-cuda-toolchain:theory
      test_command: '/opt/edcpp-test/build/xformers-load-unload-cuda-test /opt/edcpp-test/build/lifecycle-model.fixture && /opt/edcpp-test/build/flash-attention-cuda-test && /opt/edcpp-test/build/flash-api-roundtrip-cuda-test /opt/edcpp-test/build/lifecycle-model.fixture'
    secrets: inherit
